<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trước mua – Investor Decision OS</title><link rel="stylesheet" href="assets/css/decision-tool.css"></head><body data-stage="PRE_BUY"><header class="top"><div class="inner"><strong>TRƯỚC MUA</strong><a href="investor-os.html">Investor OS</a><a href="./">Trang chủ</a></div></header><main class="wrap"><section class="card"><div class="eyebrow">TRƯỚC KHI BẤM LỆNH</div><h1>Có nên mua? Mua bao nhiêu?</h1><p class="note">Dùng vốn và risk rule từ Investor Passport để giới hạn vị thế trước khi cảm xúc chen vào.</p></section><section class="card" id="formCard"><div class="grid"><label><span>Mã cổ phiếu</span><input id="symbol" placeholder="VD: FPT"></label><label><span>Giá dự kiến mua</span><input id="price" type="number" step="0.01"></label><label><span>Giá stop / mức thesis sai</span><input id="stopPrice" type="number" step="0.01"></label><label><span>Số tiền đang muốn mua</span><input id="desiredAmount" type="number"></label><label style="grid-column:1/-1"><span>Thesis ngắn gọn</span><textarea id="thesis" placeholder="Vì sao mua? Điều gì phải đúng?"></textarea></label></div><div class="actions"><button class="primary" id="run">Kiểm tra trước mua</button></div><p id="msg" class="note"></p></section><section id="result" class="card result"><div class="eyebrow">KẾT QUẢ</div><div class="metrics"><div class="metric"><span>Risk budget</span><b id="rRisk">—</b></div><div class="metric"><span>Quy mô tối đa</span><b id="rAmount">—</b></div><div class="metric"><span>Tỷ trọng</span><b id="rPct">—</b></div></div><div class="nba"><strong>Next Best Action</strong><p id="rAction"></p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="decision-tool.js"></script></body></html>
