<style>:root{--bg:#04111f;--p:#081c30;--line:rgba(224,187,99,.18);--gold:#e7c36a;--text:#dbe4ec;--muted:#8496a8;--max:1060px}*{box-sizing:border-box}body{margin:0;font-family:"Be Vietnam Pro",sans-serif;background:linear-gradient(180deg,#03101c,#06172a 48%,#04111f);color:var(--text);min-height:100vh}a{color:inherit;text-decoration:none}.wrap{width:min(calc(100% - 28px),var(--max));margin:auto}.hero{padding:28px 0 18px}.heroBox{padding:24px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,rgba(9,29,49,.98),rgba(6,21,37,.97))}.ey{font-size:11px;color:#d9bc73;font-weight:800;letter-spacing:.14em}.hero h1{font-size:clamp(30px,5vw,48px);margin:7px 0 8px;line-height:1.08}.sub{color:var(--muted);line-height:1.7;font-size:13px}.nav{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.nav a{padding:9px 12px;border:1px solid var(--line);border-radius:9px;color:#d9bc73;font-size:11px;font-weight:700}.grid{display:grid;gap:12px;padding-bottom:30px}.card{display:block;padding:20px;border:1px solid rgba(255,255,255,.07);border-radius:16px;background:linear-gradient(180deg,rgba(10,31,51,.82),rgba(7,23,39,.72))}.meta{color:#b9a66e;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}.card h2{font-size:20px;line-height:1.45;margin:8px 0;color:#e7edf2}.desc{font-size:13px;color:#9eafbe;line-height:1.7}.read{margin-top:12px;color:var(--gold);font-size:11px;font-weight:800}.article{padding:26px;border:1px solid var(--line);border-radius:18px;background:#071a2c;margin-bottom:30px}.article h1{font-size:clamp(26px,4vw,40px);line-height:1.25;margin:8px 0 14px}.article h2{font-size:19px;color:#ead18b;margin:28px 0 8px}.article p{font-size:15px;line-height:1.85;color:#cbd6df}.source{margin-top:26px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#7f91a4}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:600px){.hero{padding-top:16px}.heroBox,.article{padding:18px}.card{padding:16p <body><div id="siteHeader"></div><main><section class="hero"><div class="wrap"><div class="heroBox"><div class="ey">VÕ HOÀNG · ĐẦU TƯ CHUẨN HỆ THỐNG</div><h1>Bài viết mỗi ngày</h1><div class="sub">Một chủ đề đáng chú ý mỗi ngày: thị trường, vĩ mô, ngành và doanh nghiệp. Tập trung dữ kiện, cơ chế tác động và điều nhà đầu tư cần theo dõi.</div><div class="nav"><a href="tin-tuc-24h.html">← Tin tức 24h</a><a href="binh-luan-thi-truong-truc-tiep.html">Bình luận trực tiếp</a></div></div></div></section><section><div class="wrap"><div id="app" class="grid"><div class="empty">Đang tải bài viết…</div></div></div></section></main><div id="siteFooter"></div>
<script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const app=document.getElementById('app');fetch('data/bai-viet.json?'+Date.now()).then(r=>r.json()).then(rows=>{const slug=new URLSearchParams(location.search).get('slug');if(slug){const a=rows.find(x=>x.slug===slug);if(!a){app.innerHTML='<div class="empty">Không tìm thấy bài viết.</div>';return}document.title=a.title+' | Võ Hoàng';app.className='';app.innerHTML='<article class="article"><div class="meta">'+esc(a.date)+' · '+esc(a.category)+'</div><h1>'+esc(a.title)+'</h1>'+a.body.map(b=>b.type==='h2'?'<h2>'+esc(b.text)+'</h2>':'<p>'+esc(b.text)+'</p>').join('')+'<div class="source"><b>VÕ HOÀNG – ĐẦU TƯ CHUẨN HỆ THỐNG</b><br>Nguồn: '+esc(a.source||'Các nguồn công khai')+'. Nội dung phục vụ mục đích cập nhật và tham khảo, không phải khuyến nghị mua bán chứng khoán.</div></article>';return}app.innerHTML=rows.map(a=>'<a class="card" href="bai-viet/'+encodeURIComponent(a.slug)+'.html"'><div class="meta">'+esc(a.date)+' · '+esc(a.category)+'</div><h2>'+esc(a.title)+'</h2><div class="desc">'+esc(a.summary)+'</div><div class="read">ĐỌC BÀI →</div></a>').join('')||'<div class="empty">Chưa có bài viết.</div>'}).catch(()=>app.innerHTML='<div class="empty">Chưa tải được dữ liệu bài viết.</div>');</script><script src="site-header.js" defer></script><script src="site-footer.js" defer></script></body></html>
