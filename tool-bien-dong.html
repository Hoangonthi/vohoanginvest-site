<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Có biến động – Investor Decision OS</title><link rel="stylesheet" href="assets/css/decision-tool.css"></head><body data-stage="EVENT"><header class="top"><div class="inner"><strong>CÓ BIẾN ĐỘNG</strong><a href="investor-os.html">Investor OS</a><a href="./">Trang chủ</a></div></header><main class="wrap"><section class="card"><div class="eyebrow">NOISE HAY MATERIAL CHANGE?</div><h1>Biến động này có đáng hành động?</h1><p class="note">Tách giá chạy, tin đồn và cảm xúc khỏi thay đổi thực sự của thesis.</p></section><section class="card"><div class="grid"><label><span>Mã cổ phiếu</span><input id="symbol"></label><label><span>Nguồn thông tin</span><select id="source"><option value="ROOM">Room/KOL</option><option value="MEDIA">Báo chí</option><option value="COMPANY">Doanh nghiệp</option><option value="MARKET">Dữ liệu thị trường</option><option value="MACRO">Vĩ mô</option></select></label><label><span>Độ tin cậy</span><select id="reliability"><option value="LOW">Thấp</option><option value="MEDIUM">Trung bình</option><option value="HIGH">Cao</option></select></label><label><span>Mức độ ảnh hưởng</span><select id="materiality"><option value="LOW">Nhỏ / nhiễu</option><option value="MEDIUM">Cần theo dõi</option><option value="HIGH">Có thể đổi thesis</option></select></label><label><span>Exposure hiện tại (%)</span><input id="exposure" type="number" value="20"></label><label><span>Giá biến động (%)</span><input id="movePct" type="number" step="0.1"></label><label style="grid-column:1/-1"><span>Điều gì vừa xảy ra?</span><textarea id="eventText"></textarea></label></div><div class="actions"><button class="primary" id="run">Đánh giá biến động</button></div><p id="msg" class="note"></p></section><section id="result" class="card result"><div class="metrics"><div class="metric"><span>Độ tin cậy</span><b id="rRel">—</b></div><div class="metric"><span>Materiality</span><b id="rMat">—</b></div><div class="metric"><span>Nguy cơ phản ứng cảm xúc</span><b id="rEmotion">—</b></div></div><div class="nba"><strong>Next Best Action</strong><p id="rAction"></p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="decision-tool.js"></script></body></html>
