<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khách gửi việc – Võ Hoàng</title><link rel="icon" href="LOGO.png"><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#f4f6f8;color:#172033}header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:#fff;border-bottom:1px solid #dde3eb;position:sticky;top:0;z-index:5}.head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.head-actions a,.head-actions button{font:inherit;text-decoration:none;color:#172033;background:#fff;border:1px solid #cfd7e2;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}main{max-width:1180px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid #dde3eb;border-radius:16px;padding:20px;margin-bottom:16px}.login{max-width:420px;margin:70px auto}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,select,button{font:inherit;padding:11px 12px;border-radius:10px;border:1px solid #cfd7e2}button{cursor:pointer;font-weight:700}.primary{background:#172033;color:#fff;border-color:#172033}.google{width:100%;background:#fff;color:#172033;border:1px solid #cfd7e2;font-weight:800;margin-bottom:14px}.divider{display:flex;align-items:center;gap:10px;color:#7b8492;font-size:.85rem;margin:4px 0 14px}.divider:before,.divider:after{content:"";height:1px;background:#e0e5ec;flex:1}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar input{min-width:230px}.lead{display:grid;grid-template-columns:1.1fr 1fr 1.5fr auto;gap:16px;align-items:start}.lead h3{margin:0 0 6px}.muted{color:#6b7484;font-size:.9rem}.need{white-space:pre-wrap;line-height:1.55}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions a,.actions button{display:inline-block;text-decoration:none;padding:8px 10px;border-radius:9px;border:1px solid #cfd7e2;background:#fff;color:#172033}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#e9eef4;font-size:.8rem;font-weight:800}.topcount{font-weight:800;align-self:center}.hidden{display:none!important}.empty{padding:32px;text-align:center;color:#6b7484}@media(max-width:850px){.lead{grid-template-columns:1fr}.row{grid-template-columns:1fr}.toolbar>*{flex:1 1 100%}.toolbar input{min-width:0}header{align-items:flex-start}.head-actions{justify-content:flex-end}}</style></head><body><header><strong>VÕ HOÀNG · KHÁCH GỬI VIỆC</strong><div class="head-actions"><a href="crm-hom-nay.html">CRM Hôm nay</a><a href="nguon-khach.html">Nguồn khách</a><button id="logout" class="hidden">Đăng xuất</button></div></header><main><section id="loginBox" class="card login"><h1>Đăng nhập quản trị</h1><p class="muted">Tài khoản Admin: <strong>vohoang.bank@gmail.com</strong></p><button id="googleLogin" class="google" type="button">Đăng nhập với Google</button><div class="divider">hoặc dùng mật khẩu</div><form id="loginForm"><p><input id="email" type="email" value="vohoang.bank@gmail.com" placeholder="Email" required style="width:100%;box-sizing:border-box"></p><p><input id="password" type="password" placeholder="Mật khẩu" required style="width:100%;box-sizing:border-box"></p><button class="primary" style="width:100%">Đăng nhập</button><p id="loginMsg" class="muted"></p></form></section><section id="app" class="hidden"><div class="toolbar"><input id="search" type="search" placeholder="Tìm tên, số điện thoại, nội dung..."><select id="source"><option value="">Tất cả nguồn</option><option value="Trang dịch vụ">Trang dịch vụ</option><option value="Facebook">Facebook</option><option value="TikTok">TikTok</option><option value="Zalo">Zalo</option><option value="CTV/Ref">CTV / Ref</option></select><select id="status"><option value="">Tất cả trạng thái</option><option value="NEW">Mới</option><option value="CONTACTED">Đã liên hệ</option><option value="CONFIRMED">Đang trao đổi</option><option value="COMPLETED">Đã chốt xong</option><option value="CANCELLED">Không phù hợp / hủy</option><option value="NO_SHOW">Không phản hồi</option></select><button id="refresh">Làm mới</button><span class="topcount" id="count"></span></div><div id="list"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="admin-dich-vu.js"></script></body></html>
