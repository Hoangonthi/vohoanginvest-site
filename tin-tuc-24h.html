<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Tin tức 24h qua | Võ Hoàng</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#04111f;--panel:#081c30;--panel2:#0b223a;--line:rgba(224,187,99,.18);--gold:#e7c36a;--gold-2:#f3cf74;--text:#f6f8fb;--muted:#9eacbc;--green:#38df93;--amber:#f0b84d;--red:#ff7a82;--max:1240px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--text);background:linear-gradient(180deg,#03101c,#06172a 48%,#04111f);min-height:100vh}
a{color:inherit;text-decoration:none}
.wrap{width:min(calc(100% - 28px),var(--max));margin:auto}
.hero{padding:24px 0 12px}
.heroBox{border:1px solid var(--line);border-radius:20px;padding:20px 22px;background:linear-gradient(180deg,rgba(9,29,49,.98),rgba(6,21,37,.97))}
.eyebrow{font-size:11px;color:var(--gold);font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.hero h1{font-size:clamp(30px,4vw,46px);line-height:1.06;margin:7px 0 0;letter-spacing:-.035em}
.bar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:12px 0 10px}
.status{font-size:12px;color:var(--muted)}
.refresh{border:1px solid rgba(224,187,99,.25);background:rgba(224,187,99,.07);color:#f2d58b;border-radius:9px;padding:7px 10px;font:inherit;font-size:11px;font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding-bottom:18px;align-items:start}
.news{min-width:0;border:1px solid rgba(255,255,255,.075);border-radius:13px;background:linear-gradient(180deg,rgba(9,29,49,.96),rgba(6,21,37,.96));overflow:hidden}
.newsHead{padding:11px 12px 12px}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;margin-bottom:6px;font-size:10.5px;line-height:1.45;color:var(--muted)}
.meta b{color:#e6ce8f;font-weight:700}.meta .dot{opacity:.55}.meta .sourceLink{color:#d7bc76;font-weight:600}.meta .sourceLink:hover{color:#f2d58b}
.titleRow{display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:9px;align-items:start}
.title{font-size:14px;font-weight:700;line-height:1.48;color:#f5f7fb}
.toggle{width:28px;height:28px;border:1px solid rgba(224,187,99,.28);border-radius:8px;background:rgba(224,187,99,.06);color:var(--gold);font-size:19px;line-height:1;cursor:pointer;display:grid;place-items:center}
.analysis{display:none;border-top:1px solid rgba(255,255,255,.07);padding:12px;background:rgba(0,0,0,.12)}
.news.open .analysis{display:block}
.analysis h4{margin:0 0 8px;color:#f1d58d;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.analysis p{margin:0 0 9px;color:#c1ccd7;font-size:12px;line-height:1.62}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{font-size:9.5px;padding:4px 6px;border-radius:999px;border:1px solid rgba(255,255,255,.08);color:#b9c5d1}.chip.warn{color:#ffd071;border-color:rgba(240,184,77,.25)}.chip.good{color:#79e9ad;border-color:rgba(56,223,147,.22)}
.num{margin-top:7px;padding:8px 9px;border-radius:9px;border:1px solid rgba(255,255,255,.06);font-size:10.5px;color:#aab8c7;line-height:1.5}.num b{color:#eef3f8}
.empty{grid-column:1/-1;padding:30px;text-align:center;border:1px dashed rgba(255,255,255,.10);border-radius:14px;color:var(--muted)}
.source-note{margin:2px 0 26px;padding:11px 13px;border:1px solid rgba(255,255,255,.06);border-radius:12px;color:#8798a9;font-size:10.5px;line-height:1.55;background:rgba(255,255,255,.015)}
@media(max-width:820px){.grid{grid-template-columns:1fr;gap:7px}.hero{padding-top:16px}.heroBox{padding:18px;border-radius:17px}}
@media(max-width:520px){.wrap{width:min(calc(100% - 18px),var(--max))}.newsHead{padding:10px}.title{font-size:13.5px}.meta{font-size:10px}.analysis{padding:11px}}
</style>
</head>
<body>
<div id="siteHeader"></div>
<main>
  <section class="hero">
    <div class="wrap">
      <div class="heroBox">
        <div class="eyebrow">NEWS INTELLIGENCE V2 · 24H</div>
        <h1>Tin tức 24h qua</h1>
      </div>
      <div class="bar">
        <div class="status" id="status">Đang tải tin 24h gần nhất…</div>
        <button class="refresh" id="refresh" type="button">↻ Cập nhật</button>
      </div>
      <div class="grid" id="grid"><div class="empty">Đang lấy dữ liệu…</div></div>
      <div class="source-note">Tin được dẫn về nguồn gốc. Phần phân tích là lớp hỗ trợ sàng lọc thông tin, không phải khuyến nghị mua/bán.</div>
    </div>
  </section>
</main>
<div id="siteFooter"></div>
<script>
const API='https://elmrbnewlukxscbcfizg.supabase.co/functions/v1/news-intelligence-preview-v2';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stamp=v=>{if(!v)return'—';try{const d=new Date(v);const parts=new Intl.DateTimeFormat('vi-VN',{timeZone:'Asia/Ho_Chi_Minh',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d).reduce((a,p)=>(a[p.type]=p.value,a),{});return`${parts.hour}:${parts.minute} ${parts.day}-${parts.month}`}catch{return'—'}};
const nowStamp=()=>{try{return new Intl.DateTimeFormat('vi-VN',{timeZone:'Asia/Ho_Chi_Minh',hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit',year:'numeric',hour12:false}).format(new Date())}catch{return'—'}};
const score=v=>v==null?'—':Math.round(Number(v));
function analysis(e){const nums=(e.numbers||[]).slice(0,3).map(n=>`<div class="num"><b>${esc(n.metric||'Số liệu')}: ${esc(n.value??'—')} ${esc(n.unit||'')}</b><br>${esc(n.period||'Chưa rõ kỳ')} · ${esc(n.role||'OBSERVED')} · ${esc(n.freshness||'')}</div>`).join('');return `<h4>Phân tích hệ thống</h4><p>${esc(e.action_reason||e.summary||'Hệ thống chưa có diễn giải bổ sung cho sự kiện này.')}</p><div class="chips"><span class="chip">Tác động ${score(e.impact_score)}/100</span><span class="chip">Tin cậy ${score(e.confidence_score)}/100</span><span class="chip">Liên quan hành động ${score(e.action_relevance_score)}/100</span><span class="chip ${e.period_warning?'warn':'good'}">${esc(e.freshness_label||'Chưa đánh giá độ mới')}</span><span class="chip">${Number(e.article_count||1)} bài / ${Number(e.independent_source_count||1)} nguồn độc lập</span></div>${e.period_warning?`<p style="margin-top:9px;color:#f0cf7b">⚠ ${esc(e.period_warning)}</p>`:''}${nums}`}
function render(rows){const now=Date.now(),cut=now-24*3600000;let items=(rows||[]).filter(e=>{const t=new Date(e.published_at||e.last_seen_at||0).getTime();return Number.isFinite(t)&&t>=cut&&t<=now+3600000});items.sort((a,b)=>new Date(b.published_at||b.last_seen_at||0)-new Date(a.published_at||a.last_seen_at||0));$('#status').textContent=`${items.length} tin/sự kiện trong 24 giờ gần nhất · cập nhật ${nowStamp()}`;if(!items.length){$('#grid').innerHTML='<div class="empty">Chưa có tin trong cửa sổ 24h từ nguồn hiện tại.</div>';return}$('#grid').innerHTML=items.map((e,i)=>{const tickers=(e.tickers||[]).filter(Boolean);return `<article class="news" id="n${i}"><div class="newsHead"><div class="meta"><b>${esc(e.source_name||'Nguồn')}</b><span class="dot">•</span><span>${stamp(e.published_at||e.last_seen_at)}</span>${tickers.length?`<span class="dot">•</span><span>${tickers.map(esc).join(', ')}</span>`:''}${e.source_url?`<span class="dot">•</span><a class="sourceLink" href="${esc(e.source_url)}" target="_blank" rel="noopener noreferrer">Xem nguồn gốc ↗</a>`:''}</div><div class="titleRow"><div class="title">${esc(e.title)}</div><button class="toggle" aria-label="Mở phân tích" data-id="n${i}" type="button">+</button></div></div><div class="analysis">${analysis(e)}</div></article>`}).join('');document.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>{const card=document.getElementById(b.dataset.id),open=card.classList.toggle('open');b.textContent=open?'−':'+';b.setAttribute('aria-label',open?'Thu phân tích':'Mở phân tích')})}
async function load(){try{$('#status').textContent='Đang tải tin 24h gần nhất…';const r=await fetch(API,{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.detail||j.error||`HTTP ${r.status}`);render(j.events)}catch(e){$('#status').textContent='Không lấy được dữ liệu';$('#grid').innerHTML=`<div class="empty">${esc(e.message||e)}</div>`}}
$('#refresh').onclick=load;load();
</script>
<script type="module" src="assets/js/site-header.js?v=20260914-news24"></script>
</body>
</html>
