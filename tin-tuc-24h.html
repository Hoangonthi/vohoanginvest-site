<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Tin tức 24h qua | Võ Hoàng</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04111f;--panel:#081c30;--panel2:#0b223a;--line:rgba(224,187,99,.18);
  --gold:#e7c36a;--gold-2:#f3cf74;--text:#d9e2eb;--text-strong:#e9eef4;
  --muted:#8697a9;--green:#38df93;--amber:#f0b84d;--red:#ff7a82;--max:1240px
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Be Vietnam Pro",system-ui,sans-serif;
  color:var(--text);
  background:linear-gradient(180deg,#03101c,#06172a 48%,#04111f);
  min-height:100vh
}
a{color:inherit;text-decoration:none}
.wrap{width:min(calc(100% - 28px),var(--max));margin:auto}
.hero{padding:22px 0 12px}
.heroBox{
  border:1px solid var(--line);border-radius:20px;padding:18px 22px;
  background:linear-gradient(180deg,rgba(9,29,49,.98),rgba(6,21,37,.97))
}
.eyebrow{font-size:11px;color:#d9bc73;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.hero h1{font-size:clamp(30px,4vw,46px);line-height:1.06;margin:7px 0 0;letter-spacing:-.035em;color:#e5ebf1}
.bar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:12px 0 8px}
.status{font-size:12px;color:var(--muted)}
.refresh{border:1px solid rgba(224,187,99,.25);background:rgba(224,187,99,.07);color:#d9c17f;border-radius:9px;padding:7px 10px;font:inherit;font-size:11px;font-weight:700;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:0 0 9px;color:#78899b;font-size:10px}
.legend-item{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.legend-dot{width:7px;height:7px;border-radius:999px;background:var(--c)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding-bottom:18px;align-items:start}
.news{
  --cat:#91a2b2;--cat-soft:rgba(145,162,178,.04);
  position:relative;min-width:0;border:1px solid rgba(255,255,255,.065);border-radius:12px;
  background:linear-gradient(180deg,var(--cat-soft),rgba(6,21,37,.97));overflow:hidden
}
.news::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cat);opacity:.78}
.news.cat-market{--cat:#58c6df;--cat-soft:rgba(88,198,223,.055)}
.news.cat-macro{--cat:#e4bd65;--cat-soft:rgba(228,189,101,.055)}
.news.cat-policy{--cat:#c99ae6;--cat-soft:rgba(201,154,230,.05)}
.news.cat-company{--cat:#5fcf9c;--cat-soft:rgba(95,207,156,.05)}
.news.cat-sector{--cat:#6aaee8;--cat-soft:rgba(106,174,232,.05)}
.news.cat-world{--cat:#de927a;--cat-soft:rgba(222,146,122,.05)}
.newsHead{padding:10px 11px 11px 14px}
.categoryRow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:5px}
.categoryBadge{
  display:inline-flex;align-items:center;gap:6px;color:var(--cat);font-size:9px;line-height:1;
  font-weight:800;letter-spacing:.085em;text-transform:uppercase
}
.categoryBadge::before{content:"";width:6px;height:6px;border-radius:999px;background:var(--cat);box-shadow:0 0 0 3px color-mix(in srgb,var(--cat) 12%,transparent)}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:3px 6px;margin-bottom:6px;font-size:10.3px;line-height:1.42;color:#7f91a4}
.meta b{color:#bfae7d;font-weight:700}.meta .dot{opacity:.48}.meta .sourceLink{color:#b9a66e;font-weight:600}.meta .sourceLink:hover{color:#dac17a}
.titleRow{display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:9px;align-items:start}
.title{font-size:14px;font-weight:650;line-height:1.48;color:#d6e0e9;letter-spacing:-.005em}
.toggle{width:28px;height:28px;border:1px solid color-mix(in srgb,var(--cat) 38%,transparent);border-radius:8px;background:color-mix(in srgb,var(--cat) 8%,transparent);color:var(--cat);font-size:19px;line-height:1;cursor:pointer;display:grid;place-items:center}
.analysis{display:none;border-top:1px solid rgba(255,255,255,.06);padding:11px 12px 12px 14px;background:rgba(0,0,0,.11)}
.news.open .analysis{display:block}
.analysis h4{margin:0 0 8px;color:#cbb678;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em}
.analysis p{margin:0 0 9px;color:#acbac8;font-size:12px;line-height:1.62}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:9.3px;padding:4px 6px;border-radius:999px;border:1px solid rgba(255,255,255,.07);color:#9eafbf;background:rgba(255,255,255,.015)}
.chip.warn{color:#d4b765;border-color:rgba(240,184,77,.22)}.chip.good{color:#69c996;border-color:rgba(56,223,147,.18)}
.num{margin-top:7px;padding:8px 9px;border-radius:9px;border:1px solid rgba(255,255,255,.055);font-size:10.5px;color:#93a5b5;line-height:1.5}.num b{color:#cbd5de}
.empty{grid-column:1/-1;padding:30px;text-align:center;border:1px dashed rgba(255,255,255,.09);border-radius:14px;color:var(--muted)}
.source-note{margin:2px 0 26px;padding:11px 13px;border:1px solid rgba(255,255,255,.055);border-radius:12px;color:#748698;font-size:10.5px;line-height:1.55;background:rgba(255,255,255,.012)}
@media(max-width:820px){.grid{grid-template-columns:1fr;gap:7px}.hero{padding-top:16px}.heroBox{padding:17px;border-radius:17px}.legend{margin-bottom:8px}}
@media(max-width:520px){.wrap{width:min(calc(100% - 18px),var(--max))}.newsHead{padding:10px 10px 10px 13px}.title{font-size:13.5px}.meta{font-size:10px}.analysis{padding:11px 10px 11px 13px}.legend{gap:5px 8px}.legend-item{font-size:9.5px}}
</style>
</head>
<body>
<div id="siteHeader"></div>
<main>
  <section class="hero">
    <div class="wrap">
      <div class="heroBox">
        <div class="eyebrow">NEWS INTELLIGENCE V2 · 24H</div>
        <h1>Tin tức 24h qua</h1>
      </div>
      <div class="bar">
        <div class="status" id="status">Đang tải tin 24h gần nhất…</div>
        <button class="refresh" id="refresh" type="button">↻ Cập nhật</button>
      </div>
      <div class="legend" aria-label="Phân loại tin">
        <span class="legend-item"><i class="legend-dot" style="--c:#58c6df"></i>Thị trường</span>
        <span class="legend-item"><i class="legend-dot" style="--c:#e4bd65"></i>Vĩ mô</span>
        <span class="legend-item"><i class="legend-dot" style="--c:#c99ae6"></i>Chính sách</span>
        <span class="legend-item"><i class="legend-dot" style="--c:#5fcf9c"></i>Doanh nghiệp</span>
        <span class="legend-item"><i class="legend-dot" style="--c:#6aaee8"></i>Ngành</span>
        <span class="legend-item"><i class="legend-dot" style="--c:#de927a"></i>Quốc tế</span>
      </div>
      <div class="grid" id="grid"><div class="empty">Đang lấy dữ liệu…</div></div>
      <div class="source-note">Tin được dẫn về nguồn gốc. Phần phân tích là lớp hỗ trợ sàng lọc thông tin, không phải khuyến nghị mua/bán.</div>
    </div>
  </section>
</main>
<div id="siteFooter"></div>
<script>
const API='https://elmrbnewlukxscbcfizg.supabase.co/functions/v1/news-intelligence-preview-v2';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stamp=v=>{if(!v)return'—';try{const d=new Date(v);const parts=new Intl.DateTimeFormat('vi-VN',{timeZone:'Asia/Ho_Chi_Minh',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d).reduce((a,p)=>(a[p.type]=p.value,a),{});return`${parts.hour}:${parts.minute} ${parts.day}-${parts.month}`}catch{return'—'}};
const nowStamp=()=>{try{return new Intl.DateTimeFormat('vi-VN',{timeZone:'Asia/Ho_Chi_Minh',hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit',year:'numeric',hour12:false}).format(new Date())}catch{return'—'}};
const score=v=>v==null?'—':Math.round(Number(v));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function categoryOf(e){
  const t=norm(`${e.event_type||''} ${e.title||''} ${(e.sectors||[]).join(' ')} ${(e.tickers||[]).join(' ')}`);
  const hasTicker=(e.tickers||[]).filter(Boolean).length>0;
  if(/vn-index|vnindex|thi truong|chung khoan|khoi ngoai|thanh khoan|do rong|phien giao dich|mua rong|ban rong/.test(t))return{key:'market',label:'Thị trường'};
  if(/fed|fomc|cpi|ppi|gdp|lam phat|lai suat|loi suat|ty gia|usd|that nghiep|viec lam|kinh te vi mo|macro/.test(t))return{key:'macro',label:'Vĩ mô'};
  if(/chinh phu|quoc hoi|nghi dinh|thong tu|bo tai chinh|ngan hang nha nuoc|chinh sach|phap ly|quy dinh|thue/.test(t))return{key:'policy',label:'Chính sách'};
  if(/my |trung quoc|chau au|nhat ban|han quoc|quoc te|wall street|dow jones|nasdaq|s&p|trump|ecb|boj/.test(t))return{key:'world',label:'Quốc tế'};
  if(hasTicker||/doanh nghiep|cong ty|co dong|loi nhuan|doanh thu|co tuc|phat hanh|m&a|mua lai/.test(t))return{key:'company',label:'Doanh nghiệp'};
  if((e.sectors||[]).length||/nganh |bat dong san|ngan hang|thep|dau khi|ban le|cong nghe|det may|thuy san|xay dung|logistics/.test(t))return{key:'sector',label:'Ngành'};
  return{key:'other',label:'Tin khác'};
}
function analysis(e){const nums=(e.numbers||[]).slice(0,3).map(n=>`<div class="num"><b>${esc(n.metric||'Số liệu')}: ${esc(n.value??'—')} ${esc(n.unit||'')}</b><br>${esc(n.period||'Chưa rõ kỳ')} · ${esc(n.role||'OBSERVED')} · ${esc(n.freshness||'')}</div>`).join('');return `<h4>Phân tích hệ thống</h4><p>${esc(e.action_reason||e.summary||'Hệ thống chưa có diễn giải bổ sung cho sự kiện này.')}</p><div class="chips"><span class="chip">Tác động ${score(e.impact_score)}/100</span><span class="chip">Tin cậy ${score(e.confidence_score)}/100</span><span class="chip">Liên quan hành động ${score(e.action_relevance_score)}/100</span><span class="chip ${e.period_warning?'warn':'good'}">${esc(e.freshness_label||'Chưa đánh giá độ mới')}</span><span class="chip">${Number(e.article_count||1)} bài / ${Number(e.independent_source_count||1)} nguồn độc lập</span></div>${e.period_warning?`<p style="margin-top:9px;color:#cdb36d">⚠ ${esc(e.period_warning)}</p>`:''}${nums}`}
function render(rows){
  const now=Date.now(),cut=now-24*3600000;
  let items=(rows||[]).filter(e=>{const t=new Date(e.published_at||e.last_seen_at||0).getTime();return Number.isFinite(t)&&t>=cut&&t<=now+3600000});
  items.sort((a,b)=>new Date(b.published_at||b.last_seen_at||0)-new Date(a.published_at||a.last_seen_at||0));
  $('#status').textContent=`${items.length} tin/sự kiện trong 24 giờ gần nhất · cập nhật ${nowStamp()}`;
  if(!items.length){$('#grid').innerHTML='<div class="empty">Chưa có tin trong cửa sổ 24h từ nguồn hiện tại.</div>';return}
  $('#grid').innerHTML=items.map((e,i)=>{
    const tickers=(e.tickers||[]).filter(Boolean),cat=categoryOf(e);
    return `<article class="news cat-${cat.key}" id="n${i}">
      <div class="newsHead">
        <div class="categoryRow"><span class="categoryBadge">${esc(cat.label)}</span></div>
        <div class="meta"><b>${esc(e.source_name||'Nguồn')}</b><span class="dot">•</span><span>${stamp(e.published_at||e.last_seen_at)}</span>${tickers.length?`<span class="dot">•</span><span>${tickers.map(esc).join(', ')}</span>`:''}${e.source_url?`<span class="dot">•</span><a class="sourceLink" href="${esc(e.source_url)}" target="_blank" rel="noopener noreferrer">Xem nguồn gốc ↗</a>`:''}</div>
        <div class="titleRow"><div class="title">${esc(e.title)}</div><button class="toggle" aria-label="Mở phân tích" data-id="n${i}" type="button">+</button></div>
      </div>
      <div class="analysis">${analysis(e)}</div>
    </article>`
  }).join('');
  document.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>{const card=document.getElementById(b.dataset.id),open=card.classList.toggle('open');b.textContent=open?'−':'+';b.setAttribute('aria-label',open?'Thu phân tích':'Mở phân tích')})
}
async function load(){try{$('#status').textContent='Đang tải tin 24h gần nhất…';const r=await fetch(API,{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.detail||j.error||`HTTP ${r.status}`);render(j.events)}catch(e){$('#status').textContent='Không lấy được dữ liệu';$('#grid').innerHTML=`<div class="empty">${esc(e.message||e)}</div>`}}
$('#refresh').onclick=load;load();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="assets/js/site-header.js?v=20260914-news24-v3"></script>
</body>
</html>
