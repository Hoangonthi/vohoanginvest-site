  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f4f6f8}*{box-sizing:border-box}body{margin:0;background:#f4f6f8}.wrap{max-width:1180px;margin:24px auto;padding:0 16px}.hidden{display:none!important}.card{background:#fff;border:1px solid #dfe5ed;border-radius:16px;padding:18px;margin-bottom:14px}.login{max-width:420px;margin:70px auto}.login input,.login button,select,textarea{width:100%;font:inherit;padding:11px 12px;border-radius:10px;border:1px solid #cfd7e2}.google{margin-bottom:12px;font-weight:800;background:#fff}.primary{background:#172033!important;color:#fff!important}.muted,.small{color:#6d7786}.small{font-size:.88rem}.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}.hero h1{margin:0 0 6px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{padding:6px 9px;border-radius:999px;background:#eef2f6;font-size:.85rem;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions a,.actions button{font:inherit;text-decoration:none;padding:9px 11px;border-radius:9px;border:1px solid #cfd7e2;background:#fff;color:#172033;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.section-title{margin:6px 0 12px}.item{padding:12px 0;border-bottom:1px solid #edf0f4}.item:last-child{border-bottom:0}.item strong{display:block;margin-bottom:4px}.score{font-size:2rem;font-weight:900}.timeline{display:grid;gap:10px}.timeline .item{padding:12px;border:1px solid #edf0f4;border-radius:12px}.task-open{border-left:4px solid #172033;padding-left:10px}.quick-note{display:grid;grid-template-columns:160px 1fr auto;gap:8px;margin-top:12px}.quick-note button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:#172033;color:#fff;font-weight:800;cursor:pointer}@media(max-width:850px){.hero,.grid{grid-template-columns:1fr}.quick-note{grid-template-columns:1fr}}
  </style>
</head>
