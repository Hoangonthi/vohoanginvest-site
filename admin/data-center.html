<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trung tâm dữ liệu · Võ Hoàng</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#061522;--panel:#0a1f33;--line:rgba(255,255,255,.09);--gold:#f3cf74;--text:#e7edf6;--muted:#8293a5;--green:#35e08b;--red:#ff7279}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 Inter,Arial,sans-serif}.wrap{width:min(1180px,calc(100% - 28px));margin:28px auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}h1{margin:0;font-size:24px}.muted{color:var(--muted)}button,input,textarea,select{font:inherit}.btn{border:1px solid rgba(243,207,116,.3);background:rgba(243,207,116,.08);color:var(--gold);border-radius:9px;padding:9px 12px;cursor:pointer}.btn.red{color:#ff9aa0;border-color:rgba(255,114,121,.3)}.btn.green{color:var(--green);border-color:rgba(53,224,139,.3)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tab.active{background:rgba(243,207,116,.13)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted)}input,textarea,select{width:100%;border:1px solid var(--line);background:#071827;color:var(--text);border-radius:9px;padding:9px;outline:none}textarea{min-height:82px;resize:vertical}.cards{display:grid;gap:9px}.card{border:1px solid var(--line);border-radius:11px;padding:12px;background:rgba(0,0,0,.08)}.cardHead{display:flex;justify-content:space-between;gap:12px}.title{font-weight:750}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.chip{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:2px 7px;color:#aab7c4}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.status{font-size:11px;color:var(--muted)}[hidden]{display:none!important}.login{max-width:420px;margin:80px auto}.toast{position:fixed;right:18px;bottom:18px;background:#10283e;border:1px solid var(--line);padding:11px 14px;border-radius:10px;box-shadow:0 10px 30px #0008}@media(max-width:700px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.cardHead,.top{display:block}.top .btn{margin-top:10px}}</style></head><body>
<div class="wrap"><div id="login" class="panel login"><h1>Admin · Võ Hoàng</h1><p class="muted">Sử dụng tài khoản Google đã đăng nhập trên website. Hệ thống vẫn kiểm tra quyền Admin trước khi cho truy cập.</p><button class="btn" id="googleLoginBtn" style="margin-top:12px;width:100%">Tiếp tục với Google</button><div id="loginMsg" class="status" style="margin-top:8px"></div></div>
<div id="app" hidden><div class="top"><div><h1>Trung tâm dữ liệu & sự kiện</h1><div class="muted" id="who"></div></div><button class="btn" id="logout">Đăng xuất</button></div>
<div class="tabs"><button class="btn tab active" data-tab="create">Đăng dữ liệu</button><button class="btn tab" data-tab="queue">Hàng chờ AI</button><button class="btn tab" data-tab="mine">Dữ liệu Admin</button></div>
<section id="create" class="panel pane"><h2>Đăng cho toàn hệ thống</h2><div class="grid"><div class="field"><label>Loại</label><select id="itemType"><option value="EVENT">Sự kiện (EVENT)</option><option value="NEWS">Tin tức (NEWS)</option><option value="KNOWLEDGE">Tri thức mã/ngành (KNOWLEDGE)</option><option value="SYSTEM_NOTE">Ghi chú hệ thống (SYSTEM NOTE)</option></select></div><div class="field"><label>Trạng thái</label><select id="itemStatus"><option value="APPROVED">Duyệt & dùng ngay</option><option value="DRAFT">Lưu nháp</option></select></div><div class="field full"><label>Tiêu đề</label><input id="title" placeholder="Ví dụ: NHNN điều chỉnh lãi suất điều hành"></div><div class="field full"><label>Tóm tắt dữ kiện</label><textarea id="summary"></textarea></div><div class="field"><label>Mã liên quan</label><input id="symbols" placeholder="VCB, BID, CTG"></div><div class="field"><label>Nhóm/ngành</label><input id="sectors" placeholder="Ngân hàng, BĐS"></div><div class="field"><label>Ngày/giờ sự kiện</label><input id="eventDate" type="datetime-local"></div><div class="field"><label>Mức quan trọng 0–100</label><input id="importance" type="number" min="0" max="100" value="70"></div><div class="field full"><label>Nguồn</label><input id="sourceUrl" placeholder="https://..."></div><div class="field full"><label>Góc nhìn / ghi chú của Admin</label><textarea id="adminView" placeholder="Tách biệt với dữ kiện thực tế."></textarea></div></div><button class="btn green" id="save" style="margin-top:12px">Lưu dữ liệu</button></section>
<section id="editor" class="panel pane" hidden><div class="cardHead"><div><h2 id="editorHeading">Sửa dữ liệu</h2><div class="muted" id="editorHint"></div></div><button class="btn" id="cancelEdit">Hủy</button></div><div class="grid">
<div class="field"><label>Loại</label><select id="editType"><option value="EVENT">Sự kiện (EVENT)</option><option value="NEWS">Tin tức (NEWS)</option><option value="KNOWLEDGE">Tri thức mã/ngành (KNOWLEDGE)</option><option value="SYSTEM_NOTE">Ghi chú hệ thống (SYSTEM NOTE)</option></select></div>
<div class="field"><label>Trạng thái</label><select id="editStatus"><option value="APPROVED">Duyệt & dùng ngay</option><option value="DRAFT">Lưu nháp</option><option value="REJECTED">Loại</option></select></div>
<div class="field full"><label>Tiêu đề</label><input id="editTitle"></div><div class="field full"><label>Tóm tắt dữ kiện</label><textarea id="editSummary"></textarea></div>
<div class="field"><label>Mã liên quan</label><input id="editSymbols"></div><div class="field"><label>Nhóm/ngành</label><input id="editSectors"></div>
<div class="field"><label>Ngày/giờ sự kiện</label><input id="editEventDate" type="datetime-local"></div><div class="field"><label>Mức quan trọng 0–100</label><input id="editImportance" type="number" min="0" max="100"></div>
<div class="field full"><label>Nguồn</label><input id="editSourceUrl"></div><div class="field full"><label>Góc nhìn / ghi chú của Admin</label><textarea id="editAdminView"></textarea></div></div>
<button class="btn green" id="saveEdit" style="margin-top:12px">Lưu & xác nhận</button></section>
<section id="queue" class="panel pane" hidden><div class="cardHead"><div><h2>Hàng chờ AI · 48 giờ</h2><div class="muted">Duyệt · Sửa · Loại các sự kiện hệ thống nhận diện.</div></div><button class="btn" id="reload">Tải lại</button></div><div class="cards" id="eventCards"></div></section>
<section id="mine" class="panel pane" hidden><h2>Dữ liệu Admin</h2><div class="cards" id="itemCards"></div></section></div></div><div id="toast" class="toast" hidden></div>
<script type="module">
import {supabaseClient,SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY} from "../assets/js/supabase-client.js";
const API=SUPABASE_URL+"/functions/v1/admin-intelligence-v1",q=s=>document.querySelector(s);let data={items:[],events:[],reviews:[]},editing=null;
function toast(s){const t=q("#toast");t.textContent=s;t.hidden=false;setTimeout(()=>t.hidden=true,2600)}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function csv(a){return (a||[]).join(", ")}
async function token(){const{data:{session}}=await supabaseClient.auth.getSession();return session?.access_token||""}async function api(action,method="GET",body){const t=await token();const r=await fetch(API+"?action="+action,{method,headers:{Authorization:"Bearer "+t,apikey:SUPABASE_PUBLISHABLE_KEY,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.detail||j.error||"Lỗi");return j}
async function load(){const j=await api("dashboard");data=j;q("#who").textContent=(j.admin.display_name||"Admin")+" · "+j.admin.role;render()}
function render(){const rm=new Map(data.reviews.map(x=>[x.target_type+":"+x.target_id,x]));q("#eventCards").innerHTML=data.events.map(e=>{const rv=rm.get("NEWS_EVENT:"+e.id);return '<div class="card"><div class="cardHead"><div class="title">'+esc(e.event_title)+'</div><div class="status">'+esc(e.last_seen_at?.slice(0,16).replace("T"," ")||"")+'</div></div><div class="chips">'+(e.primary_tickers||[]).map(x=>'<span class="chip">'+esc(x)+'</span>').join("")+(e.sectors||[]).map(x=>'<span class="chip">'+esc(x)+'</span>').join("")+'</div><div class="status">'+(rv?"Đã xử lý: "+esc(rv.decision):"Chưa duyệt")+'</div><div class="actions"><button class="btn green" data-review="APPROVE" data-id="'+e.id+'">Duyệt</button><button class="btn" data-edit="'+e.id+'">Sửa</button><button class="btn red" data-review="REJECT" data-id="'+e.id+'">Loại</button></div></div>'}).join("");q("#itemCards").innerHTML=data.items.map(x=>'<div class="card"><div class="cardHead"><div class="title">'+esc(x.title)+'</div><div class="status">'+esc(x.status)+'</div></div><div class="chips">'+(x.symbols||[]).map(s=>'<span class="chip">'+esc(s)+'</span>').join("")+'</div><div class="status">'+esc(x.summary||"")+'</div><div class="actions">'+(x.status!=="APPROVED"?'<button class="btn green" data-itemstatus="APPROVED" data-id="'+x.id+'">Duyệt</button>':"")+'<button class="btn" data-itemedit="'+x.id+'">Sửa</button>'+(x.status!=="REJECTED"?'<button class="btn red" data-itemstatus="REJECTED" data-id="'+x.id+'">Loại</button>':"")+'</div></div>').join("");bind()}
function showPane(id){document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===id));document.querySelectorAll(".pane").forEach(x=>x.hidden=x.id!==id)}
function dt(v){if(!v)return"";const d=new Date(v);if(Number.isNaN(d.getTime()))return"";const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())+"T"+z(d.getHours())+":"+z(d.getMinutes())}
function openEventEditor(e){const rv=data.reviews.find(x=>x.target_type==="NEWS_EVENT"&&x.target_id===e.id)||{};editing={kind:"event",id:e.id};q("#editorHeading").textContent="Sửa tin/sự kiện đã kéo về";q("#editorHint").textContent="Tin gốc được giữ nguyên. Bản Admin sửa sẽ được toàn hệ thống ưu tiên sử dụng.";q("#editType").value=rv.override_event_type||e.event_type||"EVENT";q("#editStatus").value=rv.decision==="REJECT"?"REJECTED":"APPROVED";q("#editTitle").value=rv.override_title||e.event_title||"";q("#editSummary").value=rv.override_summary||e.summary||"";q("#editSymbols").value=csv(rv.override_symbols||e.primary_tickers);q("#editSectors").value=csv(rv.override_sectors||e.sectors);q("#editEventDate").value=dt(rv.override_event_date||e.published_at||e.last_seen_at);q("#editImportance").value=rv.override_importance??e.impact_score??70;q("#editSourceUrl").value=rv.override_source_url||e.source_url||"";q("#editAdminView").value=rv.admin_view||"";showPane("editor")}
function openItemEditor(x){editing={kind:"item",id:x.id};q("#editorHeading").textContent="Sửa dữ liệu Admin";q("#editorHint").textContent="Chỉnh đầy đủ dữ liệu do Admin đăng và lưu lại cho toàn hệ thống.";q("#editType").value=x.item_type||"EVENT";q("#editStatus").value=x.status||"DRAFT";q("#editTitle").value=x.title||"";q("#editSummary").value=x.summary||"";q("#editSymbols").value=csv(x.symbols);q("#editSectors").value=csv(x.sectors);q("#editEventDate").value=dt(x.event_date);q("#editImportance").value=x.importance??70;q("#editSourceUrl").value=x.source_url||"";q("#editAdminView").value=x.admin_view||"";showPane("editor")}
function bind(){document.querySelectorAll("[data-review]").forEach(b=>b.onclick=async()=>{await api("review","POST",{target_type:"NEWS_EVENT",target_id:b.dataset.id,decision:b.dataset.review});toast(b.dataset.review==="REJECT"?"Đã loại":"Đã duyệt");await load()});document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{const e=data.events.find(x=>x.id===b.dataset.edit);if(e)openEventEditor(e)});document.querySelectorAll("[data-itemstatus]").forEach(b=>b.onclick=async()=>{await api("item","PATCH",{id:b.dataset.id,status:b.dataset.itemstatus});toast("Đã cập nhật");await load()});document.querySelectorAll("[data-itemedit]").forEach(b=>b.onclick=()=>{const x=data.items.find(v=>v.id===b.dataset.itemedit);if(x)openItemEditor(x)})}
q("#cancelEdit").onclick=()=>{editing=null;showPane("queue")};
q("#saveEdit").onclick=async()=>{if(!editing)return;const common={item_type:q("#editType").value,title:q("#editTitle").value,summary:q("#editSummary").value,symbols:q("#editSymbols").value,sectors:q("#editSectors").value,event_date:q("#editEventDate").value?new Date(q("#editEventDate").value).toISOString():null,importance:q("#editImportance").value,source_url:q("#editSourceUrl").value,admin_view:q("#editAdminView").value};try{if(editing.kind==="event"){const rejected=q("#editStatus").value==="REJECTED";await api("review","POST",{target_type:"NEWS_EVENT",target_id:editing.id,decision:rejected?"REJECT":"EDIT",override_event_type:common.item_type,override_title:common.title,override_summary:common.summary,override_symbols:common.symbols,override_sectors:common.sectors,override_event_date:common.event_date,override_importance:common.importance,override_source_url:common.source_url,admin_view:common.admin_view});toast(rejected?"Đã loại":"Đã sửa và xác nhận")}else{await api("item","PATCH",{id:editing.id,...common,status:q("#editStatus").value});toast("Đã lưu dữ liệu Admin")}editing=null;await load();showPane(editing?.kind==="item"?"mine":"queue")}catch(e){toast(e.message)}};
q("#googleLoginBtn").onclick=async()=>{const b=q("#googleLoginBtn");q("#loginMsg").textContent="";b.disabled=true;b.textContent="Đang chuyển đến Google…";const{error}=await supabaseClient.auth.signInWithOAuth({provider:"google",options:{redirectTo:`${window.location.origin}${window.location.pathname}`,queryParams:{prompt:"select_account"}}});if(error){b.disabled=false;b.textContent="Tiếp tục với Google";q("#loginMsg").textContent="Không thể đăng nhập Google. Vui lòng thử lại."}};q("#logout").onclick=async()=>{await supabaseClient.auth.signOut();location.reload()};q("#save").onclick=async()=>{try{await api("item","POST",{item_type:q("#itemType").value,status:q("#itemStatus").value,title:q("#title").value,summary:q("#summary").value,symbols:q("#symbols").value,sectors:q("#sectors").value,event_date:q("#eventDate").value?new Date(q("#eventDate").value).toISOString():new Date().toISOString(),importance:q("#importance").value,source_url:q("#sourceUrl").value,admin_view:q("#adminView").value});toast("Đã lưu cho hệ thống");q("#title").value="";q("#summary").value="";await load()}catch(e){toast(e.message)}};q("#reload").onclick=load;document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>showPane(b.dataset.tab));
async function boot(){const{data:{session}}=await supabaseClient.auth.getSession();if(!session){q("#login").hidden=false;q("#app").hidden=true;return}try{q("#login").hidden=true;q("#app").hidden=false;await load()}catch(e){q("#app").hidden=true;q("#login").hidden=false;q("#loginMsg").textContent=e.message==="ADMIN_REQUIRED"?"Tài khoản này không có quyền Admin.":e.message}}boot();
</script></body></html>
