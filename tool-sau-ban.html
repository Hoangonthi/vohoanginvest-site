<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sau bán – Investor Decision OS</title><link rel="stylesheet" href="assets/css/decision-tool.css"></head><body data-stage="POST_SELL"><header class="top"><div class="inner"><strong>SAU BÁN</strong><a href="investor-os.html">Investor OS</a><a href="./">Trang chủ</a></div></header><main class="wrap"><section class="card"><div class="eyebrow">REVIEW QUYẾT ĐỊNH</div><h1>Quyết định có đúng không?</h1><p class="note">Lãi không chứng minh quyết định đúng. Lỗ không chứng minh quyết định sai.</p></section><section class="card"><div class="grid"><label><span>Mã cổ phiếu</span><input id="symbol"></label><label><span>Giá mua</span><input id="entry" type="number" step="0.01"></label><label><span>Giá bán</span><input id="exit" type="number" step="0.01"></label><label><span>Stop ban đầu</span><input id="plannedStop" type="number" step="0.01"></label><label><span>Lý do bán</span><select id="sellReason"><option value="PLAN">Theo kế hoạch</option><option value="THESIS">Thesis thay đổi</option><option value="STOP">Chạm stop</option><option value="PANIC">Hoảng loạn</option><option value="FOMO">Chuyển sang cơ hội khác</option></select></label><label><span>Có tuân thủ rule?</span><select id="ruleFollowed"><option value="YES">Có</option><option value="PARTLY">Một phần</option><option value="NO">Không</option></select></label><label style="grid-column:1/-1"><span>Bài học tự ghi</span><textarea id="lesson"></textarea></label></div><div class="actions"><button class="primary" id="run">Review lệnh đã bán</button></div><p id="msg" class="note"></p></section><section id="result" class="card result"><div class="metrics"><div class="metric"><span>Outcome</span><b id="rReturn">—</b></div><div class="metric"><span>Decision Quality</span><b id="rDecision">—</b></div><div class="metric"><span>Rule adherence</span><b id="rRule">—</b></div></div><div class="nba"><strong>Next Best Action</strong><p id="rAction"></p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="decision-tool.js"></script></body></html>
