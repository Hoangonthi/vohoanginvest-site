name: Increase knowledge page fonts

on:
  push:
    paths:
      - '.github/workflows/increase-knowledge-fonts.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Increase content typography one step
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('kien-thuc.html')
          s = p.read_text(encoding='utf-8')
          marker = '</style>'
          override = '''\n    /* TYPOGRAPHY OVERRIDE — knowledge content one step larger */\n    .knowledge-main .section-kicker{font-size:12px!important;}\n    .knowledge-main .section-head h2{font-size:31px!important;}\n    .knowledge-main .section-head p{font-size:14px!important;}\n    .knowledge-main .quick-card h3{font-size:15px!important;}\n    .knowledge-main .quick-card p{font-size:11px!important;}\n    .knowledge-main .quick-card b{font-size:10.5px!important;}\n    .knowledge-main .pillar-no{font-size:10px!important;}\n    .knowledge-main .pillar h3{font-size:16px!important;}\n    .knowledge-main .pillar p{font-size:11.5px!important;}\n    .knowledge-main .pillar li{font-size:10.5px!important;}\n    .knowledge-main .lesson-main > div > p{font-size:13.5px!important;}\n    .knowledge-main .lesson-rule{font-size:13px!important;}\n    .knowledge-main .lesson-small p{font-size:11.5px!important;}\n    .knowledge-main .knowledge-detail summary b{font-size:13px!important;}\n    .knowledge-main .knowledge-detail summary span{font-size:10px!important;}\n    .knowledge-main .detail-body{font-size:11.5px!important;}\n    .knowledge-main .flow-card b{font-size:10px!important;}\n    .knowledge-main .flow-card h3{font-size:15px!important;}\n    .knowledge-main .flow-card p{font-size:10.5px!important;}\n    .knowledge-main .flow-card a{font-size:10px!important;}\n    .knowledge-main .final-cta p{font-size:12px!important;}\n    @media(max-width:760px){\n      .knowledge-main .section-head h2{font-size:24px!important;}\n      .knowledge-main .section-head p{font-size:12px!important;}\n      .knowledge-main .quick-card h3{font-size:13px!important;}\n      .knowledge-main .quick-card p{font-size:10px!important;}\n      .knowledge-main .pillar h3{font-size:13.5px!important;}\n      .knowledge-main .pillar p{font-size:10px!important;}\n      .knowledge-main .pillar li{font-size:9px!important;}\n      .knowledge-main .lesson-main > div > p{font-size:11px!important;}\n      .knowledge-main .lesson-small p{font-size:9.8px!important;}\n      .knowledge-main .knowledge-detail summary b{font-size:11px!important;}\n      .knowledge-main .knowledge-detail summary span{font-size:9px!important;}\n      .knowledge-main .detail-body{font-size:10px!important;}\n      .knowledge-main .flow-card b{font-size:10px!important;}\n      .knowledge-main .flow-card h3{font-size:12.5px!important;}\n      .knowledge-main .flow-card p{font-size:9.5px!important;}\n      .knowledge-main .flow-card a{font-size:9.5px!important;}\n      .knowledge-main .final-cta p{font-size:11.5px!important;}\n    }\n'''
          if override.strip() not in s:
              s = s.replace(marker, override + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify
        shell: bash
        run: |
          grep -q 'TYPOGRAPHY OVERRIDE' kien-thuc.html
          grep -q '.knowledge-main .flow-card h3{font-size:15px!important;}' kien-thuc.html

      - name: Commit
        shell: bash
        run: |
          git config user.name 'VÕ VŨ HOÀNG'
          git config user.email 'vvhoangvn@gmail.com'
          git add kien-thuc.html
          git commit -m 'Increase knowledge page typography one step' || exit 0
          git push
