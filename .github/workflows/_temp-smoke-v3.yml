name: temp-smoke-v3
on:
  push:
    paths: ['.github/workflows/_temp-smoke-v3.yml']
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -e
          curl -fsSL --max-time 40 'https://elmrbnewlukxscbcfizg.supabase.co/functions/v1/morning-decision-test' -o /tmp/o.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/o.json'))
          print('ok', d.get('ok'))
          print('version', d.get('version'))
          print('decision', d.get('evaluation',{}).get('decision'))
          print('macro', d.get('macro'))
          print('quality', d.get('quality'))
          print('rss sources', d.get('web_news',{}).get('sources'))
          print('news', [(x.get('source'),x.get('title'),x.get('score')) for x in d.get('web_news',{}).get('items',[])[:5]])
          print('sources', [(x.get('name'),x.get('status')) for x in d.get('sources',[])])
          assert d.get('ok') is True
          assert d.get('version') == '3.0-test'
          PY
