name: update og v5
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-og-v5.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch homepage social preview to v5 PNG
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://www.vohoanginvest.com/assets/images/vohoang-social-preview-v4.jpg?v=4'
          new = 'https://www.vohoanginvest.com/assets/images/vohoang-social-preview-v5.png?v=5'
          if old not in s:
              raise SystemExit('Expected v4 OG URL not found')
          s = s.replace(old, new)
          s = s.replace('<meta property="og:image:type" content="image/jpeg">', '<meta property="og:image:type" content="image/png">')
          p.write_text(s, encoding='utf-8')
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use v5 logo-only social preview"
          git push
