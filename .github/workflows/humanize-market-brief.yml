name: Humanize market brief voice

on:
  push:
    paths:
      - '.github/workflows/humanize-market-brief.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Change first-person voice to Ad and ACE
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('assets/js/market-brief-engine.js')
          s = p.read_text(encoding='utf-8')
          repl = {
            'let headline = "Tôi ưu tiên đọc dữ liệu trước khi tăng mức độ chủ động.";': 'let headline = "Ad ưu tiên đọc dữ liệu trước khi cùng ACE tăng mức độ chủ động.";',
            'let action = "Giữ tỷ trọng phù hợp với mức xác nhận hiện tại và chỉ hành động khi điều kiện của từng vị thế đủ rõ.";': 'let action = "ACE nên giữ tỷ trọng phù hợp với mức xác nhận hiện tại và chỉ hành động khi điều kiện của từng vị thế đủ rõ.";',
            'headline = "Ở trạng thái hiện tại, tôi ưu tiên bảo toàn vốn hơn dự đoán đáy.";': 'headline = "Ở trạng thái hiện tại, Ad ưu tiên cùng ACE bảo toàn vốn hơn là cố dự đoán đáy.";',
            'action = "Ưu tiên kiểm soát đòn bẩy, xử lý vị thế vi phạm kế hoạch và hạn chế bình quân giá xuống chỉ vì giá đã giảm.";': 'action = "ACE ưu tiên kiểm soát đòn bẩy, xử lý các vị thế đã vi phạm kế hoạch và hạn chế bình quân giá xuống chỉ vì giá đã giảm.";',
            'detail = "Tôi không phủ nhận khả năng cải thiện, nhưng muốn thấy độ rộng và dòng tiền đi cùng trước khi tăng đáng kể mức rủi ro.";': 'detail = "Ad không phủ nhận khả năng cải thiện, nhưng muốn cùng ACE thấy độ rộng và dòng tiền đi cùng trước khi tăng đáng kể mức rủi ro.";',
            'action = "Giữ tỷ trọng vừa phải, ưu tiên mã có sức mạnh riêng và tránh mở rộng vị thế chỉ vì chỉ số hồi.";': 'action = "ACE nên giữ tỷ trọng vừa phải, ưu tiên mã có sức mạnh riêng và tránh mở rộng vị thế chỉ vì chỉ số hồi.";',
            'action = "Theo dõi cơ hội có sức mạnh rõ, giữ điểm sai cụ thể và chưa cần tăng tỷ trọng đồng loạt.";': 'action = "ACE ưu tiên theo dõi cơ hội có sức mạnh rõ, giữ điểm sai cụ thể và chưa cần tăng tỷ trọng đồng loạt.";',
            'detail = "Tôi ưu tiên những cơ hội có sức mạnh tương đối, dòng tiền hỗ trợ và điểm sai rõ ràng thay vì mở rộng rủi ro trên toàn bộ danh mục.";': 'detail = "Ad ưu tiên cùng ACE chọn những cơ hội có sức mạnh tương đối, dòng tiền hỗ trợ và điểm sai rõ ràng thay vì mở rộng rủi ro trên toàn bộ danh mục.";',
            'action = "Có thể tăng dần mức chủ động ở các cơ hội đạt điều kiện, đồng thời giữ tỷ trọng và điểm sai trong giới hạn kế hoạch.";': 'action = "ACE có thể tăng dần mức chủ động ở các cơ hội đạt điều kiện, đồng thời giữ tỷ trọng và điểm sai trong giới hạn kế hoạch.";',
            'detail = "Sức mạnh hiện tại đáng ghi nhận; điều tôi không muốn là biến một trạng thái tốt thành một giao dịch kém vì mua đuổi hoặc dùng tỷ trọng quá lớn.";': 'detail = "Sức mạnh hiện tại đáng ghi nhận; điều Ad không muốn ACE gặp phải là biến một trạng thái tốt thành một giao dịch kém vì mua đuổi hoặc dùng tỷ trọng quá lớn.";',
            'action = "Ưu tiên đi cùng nhóm mạnh nhưng tránh mua bằng mọi giá; chỉ tăng tỷ trọng khi điểm vào và mức rủi ro vẫn hợp lý.";': 'action = "ACE có thể ưu tiên đi cùng nhóm mạnh nhưng tránh mua bằng mọi giá; chỉ tăng tỷ trọng khi điểm vào và mức rủi ro vẫn hợp lý.";',
            'detail = "Khi độ rộng, dòng tiền và nhóm dẫn dắt cùng ủng hộ, tôi ưu tiên đi cùng sức mạnh nhưng vẫn giữ kỷ luật từng vị thế.";': 'detail = "Khi độ rộng, dòng tiền và nhóm dẫn dắt cùng ủng hộ, Ad ưu tiên cùng ACE đi theo sức mạnh nhưng vẫn giữ kỷ luật từng vị thế.";',
            'action = "Có thể chủ động với các cơ hội đạt điều kiện, nhưng không bỏ qua điểm sai, tỷ trọng và tổng rủi ro danh mục.";': 'action = "ACE có thể chủ động với các cơ hội đạt điều kiện, nhưng không bỏ qua điểm sai, tỷ trọng và tổng rủi ro danh mục.";'
          }
          for a,b in repl.items():
            if a not in s:
              raise SystemExit(f'missing engine string: {a}')
            s = s.replace(a,b,1)
          p.write_text(s,encoding='utf-8')

          p = Path('assets/js/market-reader.js')
          s = p.read_text(encoding='utf-8')
          repl = {
            "let h='Tôi không cố đoán thị trường sẽ đi bao nhiêu điểm.',p='Điều tôi quan tâm là độ rộng, dòng tiền, nhóm dẫn dắt và việc một tài khoản cụ thể có đang được phép tăng rủi ro hay không.';": "let h='Ad không cố đoán thị trường sẽ đi bao nhiêu điểm.',p='Điều Ad quan tâm là độ rộng, dòng tiền, nhóm dẫn dắt và việc ACE có đang ở trạng thái phù hợp để tăng rủi ro hay không.';",
            "h='Ở trạng thái này, tôi quan tâm bảo toàn vốn hơn dự đoán đáy.';p='Nếu độ rộng chưa cải thiện và dòng tiền chưa xác nhận, một nhịp hồi chưa đủ để tôi mở rộng rủi ro. Cơ hội thật không cần phải mua bằng mọi giá.'": "h='Ở trạng thái này, Ad ưu tiên cùng ACE bảo toàn vốn hơn là cố dự đoán đáy.';p='Nếu độ rộng chưa cải thiện và dòng tiền chưa xác nhận, một nhịp hồi chưa đủ để ACE mở rộng rủi ro. Cơ hội tốt không cần phải mua bằng mọi giá.'",
            "h='Thị trường tích cực vẫn không miễn trừ kỷ luật từng lệnh.';p='Tôi muốn thấy sức mạnh lan tỏa, nhóm dẫn dắt bền và mỗi vị thế mới có điểm sai rõ ràng trước khi tăng tỷ trọng.'": "h='Thị trường tích cực vẫn không miễn trừ kỷ luật từng lệnh.';p='Ad muốn cùng ACE thấy sức mạnh lan tỏa, nhóm dẫn dắt bền và mỗi vị thế mới có điểm sai rõ ràng trước khi tăng tỷ trọng.'"
          }
          for a,b in repl.items():
            if a not in s:
              raise SystemExit(f'missing reader string: {a}')
            s = s.replace(a,b,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'VÕ VŨ HOÀNG'
          git config user.email 'vvhoangvn@gmail.com'
          git add assets/js/market-brief-engine.js assets/js/market-reader.js
          git commit -m 'Humanize market brief voice for ACE' || exit 0
          git push
