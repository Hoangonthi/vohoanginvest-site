name: Fix Turnstile site key

on:
  push:
    paths:
      - '.github/workflows/fix-turnstile-sitekey.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace incorrect Turnstile site key
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = '0x4AAAAAAEYKnha19nmpaSeM'
          new = '0x4AAAAAAEyKnha19nmpaSeM'
          targets = [Path('assets/js/site-header.js'), Path('dang-nhap.html')]

          changed = []
          for p in targets:
              s = p.read_text(encoding='utf-8')
              if old in s:
                  s = s.replace(old, new)
                  p.write_text(s, encoding='utf-8')
                  changed.append(str(p))
              elif new not in s:
                  raise SystemExit(f'Expected Turnstile site key not found in {p}')

          # Cache-bust shared header loader so browsers receive the corrected key.
          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              s2 = s.replace('assets/js/site-header.js?v=20260913-7', 'assets/js/site-header.js?v=20260913-8')
              if s2 != s:
                  p.write_text(s2, encoding='utf-8')

          print('Changed:', ', '.join(changed) if changed else 'already correct')
          PY

      - name: Verify exact site key
        shell: bash
        run: |
          grep -q '0x4AAAAAAEyKnha19nmpaSeM' assets/js/site-header.js
          grep -q '0x4AAAAAAEyKnha19nmpaSeM' dang-nhap.html
          ! grep -q '0x4AAAAAAEYKnha19nmpaSeM' assets/js/site-header.js
          ! grep -q '0x4AAAAAAEYKnha19nmpaSeM' dang-nhap.html

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'VÕ VŨ HOÀNG'
          git config user.email 'vvhoangvn@gmail.com'
          git add assets/js/site-header.js dang-nhap.html '*.html'
          git commit -m 'Fix Cloudflare Turnstile site key' || exit 0
          git push
