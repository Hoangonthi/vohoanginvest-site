name: bust social image cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bust-social-image-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version social image URL
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://www.vohoanginvest.com/assets/images/vohoang-social-preview.jpg'
          new = 'https://www.vohoanginvest.com/assets/images/vohoang-social-preview.jpg?v=2'
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bust-social-image-cache.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/bust-social-image-cache.yml
          git commit -m "Refresh social preview image cache key"
          git push
