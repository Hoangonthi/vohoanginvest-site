name: Turnstile diagnostics patch

on:
  push:
    paths:
      - '.github/workflows/turnstile-diagnostics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Turnstile error diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Shared popup
          p = Path('assets/js/site-header.js')
          s = p.read_text(encoding='utf-8')
          old = '''        \"error-callback\": () => { popupCaptchaToken = \"\"; },\n      });'''
          new = '''        \"error-callback\": (errorCode) => {\n          popupCaptchaToken = \"\";\n          const code = String(errorCode || \"unknown\");\n          console.warn(\"Turnstile popup error:\", code);\n          setMessage(loginMessage, `Xác minh bảo mật gặp lỗi Cloudflare (mã ${code}). Vui lòng tải lại trang hoặc thử trình duyệt/mạng khác.`, \"error\");\n          return true;\n        },\n        \"timeout-callback\": () => {\n          popupCaptchaToken = \"\";\n          setMessage(loginMessage, \"Xác minh bảo mật đã hết thời gian. Vui lòng thử lại.\", \"error\");\n        },\n      });'''
          if old not in s:
              raise SystemExit('shared Turnstile callback block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Full login page
          p = Path('dang-nhap.html')
          h = p.read_text(encoding='utf-8')
          old = '''          'error-callback': () => { authCaptchaToken = ''; },\n        });'''
          new = '''          'error-callback': (errorCode) => {\n            authCaptchaToken = '';\n            const code = String(errorCode || 'unknown');\n            console.warn('Turnstile page error:', code);\n            showMessage(`Xác minh bảo mật gặp lỗi Cloudflare (mã ${code}). Vui lòng tải lại trang hoặc thử trình duyệt/mạng khác.`, 'error');\n            return true;\n          },\n          'timeout-callback': () => {\n            authCaptchaToken = '';\n            showMessage('Xác minh bảo mật đã hết thời gian. Vui lòng thử lại.', 'error');\n          },\n        });'''
          if old not in h:
              raise SystemExit('page Turnstile callback block not found')
          h = h.replace(old, new, 1)
          p.write_text(h, encoding='utf-8')

          # cache bust shared header loader
          for html in Path('.').glob('*.html'):
              text = html.read_text(encoding='utf-8')
              text2 = text.replace('assets/js/site-header.js?v=20260913-6', 'assets/js/site-header.js?v=20260913-7')
              text2 = text2.replace('assets/js/site-header.js?v=20260913-5', 'assets/js/site-header.js?v=20260913-7')
              if text2 != text:
                  html.write_text(text2, encoding='utf-8')
          PY

      - name: Verify patch
        shell: bash
        run: |
          grep -q 'Turnstile popup error' assets/js/site-header.js
          grep -q 'Turnstile page error' dang-nhap.html
          grep -q 'mã ${code}' assets/js/site-header.js
          grep -q 'mã ${code}' dang-nhap.html

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'VÕ VŨ HOÀNG'
          git config user.email 'vvhoangvn@gmail.com'
          git add assets/js/site-header.js dang-nhap.html '*.html'
          git commit -m 'Show Turnstile error codes in auth UI' || exit 0
          git push
