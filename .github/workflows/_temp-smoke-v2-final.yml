name: temp-smoke-v2-final
on:
  push:
    paths: ['.github/workflows/_temp-smoke-v2-final.yml']
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -e
          curl -fsSL --max-time 30 'https://elmrbnewlukxscbcfizg.supabase.co/functions/v1/morning-decision-test' -o /tmp/o.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/o.json'))
          assert d.get('ok') is True
          assert d.get('version')=='2.0-final'
          titles=[x.get('title','') for x in d.get('variables',[]) if x.get('kind')=='NEWS']
          print('decision',d.get('evaluation',{}).get('decision'))
          print('news_titles',titles)
          print('quality',d.get('quality'))
          print('sources',[(s.get('name'),s.get('status')) for s in d.get('sources',[])])
          assert len(titles)==len(set(t.replace(' ','').lower() for t in titles))
          PY
