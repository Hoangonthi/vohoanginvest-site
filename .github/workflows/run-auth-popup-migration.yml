name: Run auth popup migration

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply migration
        run: python .tmp-auth-popup-migrate.py

      - name: Remove temporary migration files
        run: rm -f .tmp-auth-popup-migrate.py .github/workflows/run-auth-popup-migration.yml

      - name: Commit changes
        run: |
          git config user.name "VÕ VŨ HOÀNG"
          git config user.email "vvhoangvn@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "[auth-popup-sync] Add shared login popup and secure password change"
          git push
