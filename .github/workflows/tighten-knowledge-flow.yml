name: Tighten knowledge roadmap cards

on:
  push:
    paths:
      - '.github/workflows/tighten-knowledge-flow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tighten roadmap card height
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('kien-thuc.html')
          s = p.read_text(encoding='utf-8')

          old = '''    .flow-card{\n      position:relative;\n\n      min-height:150px;\n\n      padding:15px;'''
          new = '''    .flow-card{\n      position:relative;\n\n      min-height:0;\n\n      padding:13px 15px 12px;'''
          if old not in s:
              raise SystemExit('desktop flow-card block not found')
          s = s.replace(old, new, 1)

          old_mobile = '''      .flow-card{\n        min-height:145px;\n\n        padding:11px 9px;\n\n        text-align:center;\n      }'''
          new_mobile = '''      .flow-card{\n        min-height:0;\n\n        padding:10px 9px 9px;\n\n        text-align:center;\n      }'''
          if old_mobile not in s:
              raise SystemExit('mobile flow-card block not found')
          s = s.replace(old_mobile, new_mobile, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify
        shell: bash
        run: |
          grep -q 'padding:13px 15px 12px' kien-thuc.html
          grep -q 'padding:10px 9px 9px' kien-thuc.html

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'VÕ VŨ HOÀNG'
          git config user.email 'vvhoangvn@gmail.com'
          git add kien-thuc.html
          git commit -m 'Tighten knowledge roadmap card spacing' || exit 0
          git push
