name: One-time shared layout migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[shared-layout-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize public pages to shared header and footer
        shell: python
        run: |
          from pathlib import Path
          import re

          targets = [
              "index.html",
              "thi-truong-hom-nay.html",
              "sang-nay-can-nhin-gi.html",
              "sau-phien-cua-toi.html",
              "watchlist.html",
              "kien-thuc.html",
              "investor-calculator.html",
              "ve-toi.html",
              "dang-nhap.html",
              "kiem-tra-nhanh-tai-khoan.html",
              "mien-tru-trach-nhiem.html",
              "chinh-sach-bao-mat.html",
              "dieu-khoan-su-dung.html",
              "du-lieu-bai-danh-gia.html",
              "lien-he.html",
          ]

          supabase = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
          shared = '<script type="module" src="assets/js/site-header.js?v=20260913-3"></script>'

          header_re = re.compile(
              r'\s*<header\b[^>]*class=["\'][^"\']*\btopbar\b[^"\']*["\'][^>]*>.*?</header>\s*',
              re.I | re.S,
          )
          footer_re = re.compile(
              r'\s*<footer\b[^>]*class=["\'][^"\']*\bfooter\b[^"\']*["\'][^>]*>.*?</footer>\s*',
              re.I | re.S,
          )
          script_re = re.compile(r'<script\b[^>]*>.*?</script>', re.I | re.S)
          direct_shared_re = re.compile(
              r'\s*<script\s+type=["\']module["\']\s+src=["\']assets/js/site-header\.js(?:\?[^"\']*)?["\']\s*></script>\s*',
              re.I,
          )

          def remove_legacy_menu_scripts(text):
              def repl(match):
                  block = match.group(0)
                  # Chỉ xóa script menu cũ đơn nhiệm vụ; không đụng script logic trang.
                  if (
                      "menuBtn" in block
                      and "mobileDrawer" in block
                      and len(block) < 2600
                      and "fetch(" not in block
                      and "supabase" not in block.lower()
                      and "MARKET_URL" not in block
                  ):
                      return ""
                  return block
              return script_re.sub(repl, text)

          changed = []
          for name in targets:
              path = Path(name)
              if not path.exists():
                  continue

              text = path.read_text(encoding="utf-8")
              before = text

              # 1) Header: chỉ thay phần đầu, không đụng nội dung giữa.
              if 'id="siteHeader"' not in text:
                  text, n = header_re.subn('\n  <div id="siteHeader"></div>\n', text, count=1)
                  if n == 0:
                      text = re.sub(
                          r'(<body\b[^>]*>)',
                          r'\1\n  <div id="siteHeader"></div>\n',
                          text,
                          count=1,
                          flags=re.I,
                      )

              # 2) Footer: thay footer tĩnh bằng host dùng chung.
              if 'id="siteFooter"' not in text:
                  text, n = footer_re.subn('\n  <div id="siteFooter"></div>\n', text, count=1)
                  if n == 0:
                      text = re.sub(
                          r'</body>',
                          '  <div id="siteFooter"></div>\n</body>',
                          text,
                          count=1,
                          flags=re.I,
                      )

              # 3) Bỏ JS menu cũ chắc chắn không còn dùng.
              text = remove_legacy_menu_scripts(text)

              # 4) Chỉ giữ một site-header.js dùng chung và chuẩn hóa cache version.
              text = direct_shared_re.sub('\n', text)

              # Supabase phải có trước module dùng chung.
              if '@supabase/supabase-js@2' not in text:
                  inject = f'\n  {supabase}\n  {shared}\n'
              else:
                  inject = f'\n  {shared}\n'

              text = re.sub(
                  r'</body>',
                  inject + '</body>',
                  text,
                  count=1,
                  flags=re.I,
              )

              if text != before:
                  path.write_text(text, encoding="utf-8")
                  changed.append(name)

          print("Changed pages:")
          for name in changed:
              print("-", name)

      - name: Remove this one-time workflow
        run: rm -f .github/workflows/shared-layout-migrate.yml

      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "VÕ VŨ HOÀNG"
          git config user.email "vvhoangvn@gmail.com"
          git add -A
          git commit -m "[shared-layout-sync] Use shared header/footer across public pages"
          git push
