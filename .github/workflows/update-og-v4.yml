name: update og v4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-og-v4.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Point social metadata to v4 image
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://www.vohoanginvest.com/assets/images/vohoang-social-preview.jpg'
          new = 'https://www.vohoanginvest.com/assets/images/vohoang-social-preview-v4.jpg?v=4'
          count = s.count(old)
          if count < 3:
              raise SystemExit(f'Expected at least 3 old social image URLs, found {count}')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

      - name: Commit update and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/update-og-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-og-v4.yml
          git commit -m "Use high-quality v4 social preview image"
          git push
