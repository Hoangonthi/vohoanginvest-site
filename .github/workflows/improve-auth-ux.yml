name: Improve auth UX

on:
  push:
    paths:
      - '.github/workflows/improve-auth-ux.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch auth email cooldown messages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('dang-nhap.html')
          s=p.read_text(encoding='utf-8')

          marker='''    function setLoading(button, loading, normalText, loadingText){
      if(!button) return;
      button.disabled = loading;
      button.textContent = loading ? loadingText : normalText;
    }
'''
          addition='''    function setLoading(button, loading, normalText, loadingText){
      if(!button) return;
      button.disabled = loading;
      button.textContent = loading ? loadingText : normalText;
    }

    const AUTH_EMAIL_COOLDOWN_MS = 65000;
    const authEmailCooldowns = new Map();

    function authEmailCooldownKey(email){
      return normalizeEmail(email);
    }

    function getAuthEmailCooldownRemaining(email){
      const until = authEmailCooldowns.get(authEmailCooldownKey(email)) || 0;
      return Math.max(0, Math.ceil((until - Date.now()) / 1000));
    }

    function rememberAuthEmailSent(email){
      authEmailCooldowns.set(authEmailCooldownKey(email), Date.now() + AUTH_EMAIL_COOLDOWN_MS);
    }

    function guardAuthEmailCooldown(email){
      const seconds = getAuthEmailCooldownRemaining(email);
      if(seconds <= 0) return true;
      showMessage(`Email xác thực vừa được gửi. ACE vui lòng chờ khoảng ${seconds} giây rồi mới yêu cầu gửi lại.`, "info");
      return false;
    }

    function authRateLimitMessage(error){
      const raw = String(error?.message || "").toLowerCase();
      const match = raw.match(/(\\d+)\\s*seconds?/);
      const seconds = match ? Number(match[1]) : 60;
      if(raw.includes("rate") || raw.includes("security purposes") || raw.includes("seconds")){
        return `Hệ thống đang giới hạn gửi email liên tiếp để bảo vệ tài khoản. ACE vui lòng chờ khoảng ${seconds} giây rồi thử lại.`;
      }
      return null;
    }
'''
