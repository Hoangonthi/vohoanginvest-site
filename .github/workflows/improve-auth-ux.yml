name: Improve auth UX

on:
  push:
    paths:
      - '.github/workflows/improve-auth-ux.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch login signup forgot UX
        shell: bash
        run: |
          echo '' | base64 -d >/tmp/patch_auth.py
          python /tmp/patch_auth.py

      - name: Validate page script syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('dang-nhap.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script type="module">([\s\S]*?)</script>',s)
          if not scripts:
              raise SystemExit('module script not found')
          Path('/tmp/auth-module.mjs').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/auth-module.mjs

      - name: Commit
        shell: bash
        run: |
          git config user.name 'VÕ VŨ HOÀNG'
          git config user.email 'vvhoangvn@gmail.com'
          git add dang-nhap.html
          git commit -m 'Improve auth email validation and mobile UX' || exit 0
          git push
