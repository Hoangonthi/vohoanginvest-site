'''
          new = '''    const COMMON_EMAIL_DOMAINS = ["gmail.com","outlook.com","hotmail.com","yahoo.com","icloud.com"];

    function normalizeEmail(value){
      return String(value || "").trim().toLowerCase();
    }

    function isValidEmail(value){
      return /^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/.test(normalizeEmail(value));
    }

    function emailDomainDistance(a,b){
      a = String(a || "").toLowerCase();
      b = String(b || "").toLowerCase();
      const dp = Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));
      for(let i=0;i<=a.length;i++) dp[i][0]=i;
      for(let j=0;j<=b.length;j++) dp[0][j]=j;
      for(let i=1;i<=a.length;i++){
        for(let j=1;j<=b.length;j++){
          dp[i][j]=Math.min(
            dp[i-1][j]+1,
            dp[i][j-1]+1,
            dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1)
          );
        }
      }
      return dp[a.length][b.length];
    }

    function likelyEmailCorrection(value){
      const email = normalizeEmail(value);
      const at = email.lastIndexOf("@");
      if(at <= 0) return null;
      const local = email.slice(0,at);
      const domain = email.slice(at+1);
      if(!domain || COMMON_EMAIL_DOMAINS.includes(domain)) return null;
      const target = COMMON_EMAIL_DOMAINS.find(item => emailDomainDistance(domain,item) <= 1);
      return target ? `${local}@${target}` : null;
    }

    function validateEmailForAction(value){
      const email = normalizeEmail(value);
      if(!isValidEmail(email)){
        return { ok:false, email, message:"Vui lòng nhập đúng định dạng email, ví dụ: ten@gmail.com." };
      }
      const corrected = likelyEmailCorrection(email);
      if(corrected){
        return { ok:false, email, corrected, message:`Email có thể bị gõ nhầm. Có phải ACE muốn dùng ${corrected}?` };
      }
      return { ok:true, email };
    }

    function setupEmailSuggestions(input){
      if(!input || input.dataset.emailSuggestionsReady) return;
      input.dataset.emailSuggestionsReady = "1";
      const box = document.createElement("div");
      box.className = "auth-email-suggestions";
      box.hidden = true;
      input.insertAdjacentElement("afterend", box);

      const render = () => {
        const value = String(input.value || "").trim();
        const at = value.lastIndexOf("@");
        if(at <= 0){ box.hidden = true; box.innerHTML = ""; return; }
        const local = value.slice(0,at);
        const typedDomain = value.slice(at+1).toLowerCase();
        const typo = likelyEmailCorrection(value);
        let options = [];
        if(typo){
          options = [typo];
        }else{
          options = COMMON_EMAIL_DOMAINS
            .filter(domain => !typedDomain || domain.startsWith(typedDomain))
            .slice(0,4)
            .map(domain => `${local}@${domain}`);
        }
        if(!options.length){ box.hidden = true; box.innerHTML = ""; return; }
        box.innerHTML = options.map(email => `<button type="button" data-email-choice="${email.replaceAll('"','&quot;')}">${email}</button>`).join("");
        box.hidden = false;
      };

      input.addEventListener("input", render);
      input.addEventListener("focus", render);
      input.addEventListener("blur", () => window.setTimeout(() => { box.hidden = true; }, 160));
      box.addEventListener("mousedown", event => event.preventDefault());
      box.addEventListener("click", event => {
        const button = event.target.closest("[data-email-choice]");
        if(!button) return;
        input.value = button.dataset.emailChoice || "";
        box.hidden = true;
        input.focus({preventScroll:true});
      });
    }

    ["loginEmail","signupEmail","forgotEmail"].forEach(id => setupEmailSuggestions(document.getElementById(id)));
