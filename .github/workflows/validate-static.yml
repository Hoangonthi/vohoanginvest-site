name: validate static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch password recovery handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('dang-nhap.html')
          s=p.read_text(encoding='utf-8')
          old='''      setLoading(button, true, "Cập nhật mật khẩu", "Đang cập nhật...");\n\n      const { error } = await supabaseClient.auth.updateUser({\n        password\n      });\n\n      setLoading(button, false, "Cập nhật mật khẩu", "Đang cập nhật...");\n\n      if(error){\n        showMessage("Chưa thể cập nhật mật khẩu. Liên kết có thể đã hết hạn.", "error");\n        return;\n      }\n'''
          new='''      const { data: recoverySessionData } = await supabaseClient.auth.getSession();\n      if(!recoverySessionData.session){\n        showMessage("Phiên khôi phục chưa được xác nhận. ACE vui lòng mở lại liên kết mới nhất trong email đặt lại mật khẩu.", "error");\n        return;\n      }\n\n      setLoading(button, true, "Cập nhật mật khẩu", "Đang cập nhật...");\n\n      const { error } = await supabaseClient.auth.updateUser({\n        password\n      });\n\n      setLoading(button, false, "Cập nhật mật khẩu", "Đang cập nhật...");\n\n      if(error){\n        const message = String(error.message || "").toLowerCase();\n        const code = String(error.code || "").toLowerCase();\n\n        if(message.includes("different") || message.includes("same password")){\n          showMessage("Mật khẩu mới phải khác mật khẩu đang sử dụng. ACE hãy chọn một mật khẩu khác rồi thử lại.", "error");\n        }else if(code.includes("weak_password") || message.includes("weak password") || message.includes("password should be")){\n          showMessage("Mật khẩu mới chưa đáp ứng yêu cầu bảo mật. ACE hãy dùng ít nhất 8 ký tự và nên kết hợp chữ hoa, chữ thường, số và ký tự đặc biệt.", "error");\n        }else if(message.includes("session") || message.includes("jwt") || message.includes("expired")){\n          showMessage("Phiên khôi phục không còn hợp lệ. ACE vui lòng yêu cầu một email đặt lại mật khẩu mới.", "error");\n        }else{\n          showMessage("Chưa thể cập nhật mật khẩu. ACE vui lòng thử một mật khẩu khác; nếu vẫn lỗi hãy yêu cầu lại email khôi phục mới.", "error");\n        }\n        console.warn("Password recovery update failed:", error);\n        return;\n      }\n'''
          if old not in s:
              raise SystemExit('recovery block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('dang-nhap.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script type="module">([\s\S]*?)</script>',s)
          if not scripts:
              raise SystemExit('module script not found')
          Path('/tmp/auth-module.mjs').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/auth-module.mjs
      - name: Commit auth fix
        shell: bash
        run: |
          if git diff --quiet -- dang-nhap.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name 'VÕ VŨ HOÀNG'
          git config user.email 'vvhoangvn@gmail.com'
          git add dang-nhap.html
          git commit -m 'Clarify password recovery errors and verify recovery session'
          git push
