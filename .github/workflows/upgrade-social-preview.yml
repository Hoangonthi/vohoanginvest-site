name: upgrade social preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-social-preview.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Upgrade social preview image
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image, ImageOps, ImageFilter, ImageEnhance

          path = Path('assets/images/vohoang-social-preview.jpg')
          img = Image.open(path).convert('RGB')
          img = ImageOps.fit(img, (1200, 630), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
          img = img.filter(ImageFilter.UnsharpMask(radius=1.0, percent=135, threshold=2))
          img = ImageEnhance.Contrast(img).enhance(1.03)

          best = None
          for quality in range(92, 69, -1):
              tmp = Path('/tmp/social-preview.jpg')
              img.save(tmp, 'JPEG', quality=quality, subsampling=0, optimize=True, progressive=True)
              kb = tmp.stat().st_size / 1024
              if kb <= 120:
                  best = (quality, kb, tmp.read_bytes())
                  if kb >= 70:
                      break

          if best is None:
              raise SystemExit('Could not produce preview under 120 KB')

          quality, kb, data = best
          path.write_bytes(data)
          print(f'preview quality={quality}, size={kb:.1f} KB')

          html = Path('index.html')
          s = html.read_text(encoding='utf-8')
          s = s.replace('<meta property="og:image:width" content="640">', '<meta property="og:image:width" content="1200">')
          s = s.replace('<meta property="og:image:height" content="336">', '<meta property="og:image:height" content="630">')
          html.write_text(s, encoding='utf-8')

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/upgrade-social-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/vohoang-social-preview.jpg index.html .github/workflows/upgrade-social-preview.yml
          git commit -m "Improve homepage social preview image quality"
          git push
