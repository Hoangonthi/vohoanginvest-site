name: Run Turnstile patch

on:
  push:
    paths:
      - '.github/workflows/run-turnstile-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/add_turnstile.py
      - name: Sanity checks
        run: |
          grep -q 'TURNSTILE_SITE_KEY' assets/js/site-header.js
          grep -q 'captchaToken: popupCaptchaToken' assets/js/site-header.js
          grep -q 'id="authTurnstile"' dang-nhap.html
          grep -q 'captchaToken: authCaptchaToken' dang-nhap.html
      - name: Commit and clean temporary files
        run: |
          git config user.name 'VÕ VŨ HOÀNG'
          git config user.email 'vvhoangvn@gmail.com'
          git rm .github/scripts/add_turnstile.py .github/workflows/run-turnstile-patch.yml
          git add assets/js/site-header.js dang-nhap.html '*.html'
          git commit -m 'Add Cloudflare Turnstile to auth flows'
          git push
