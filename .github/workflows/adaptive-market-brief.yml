name: Adaptive market brief

on:
  push:
    paths:
      - '.github/workflows/adaptive-market-brief.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Connect adaptive brief engine
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('assets/js/market-reader.js')
          s=p.read_text(encoding='utf-8')
          old='import { trackTool } from "./tool-events.js";'
          new='import { trackTool } from "./tool-events.js";\nimport { getAdaptiveMarketBrief } from "./market-brief-engine.js";'
          if 'getAdaptiveMarketBrief' not in s:
              s=s.replace(old,new,1)
          s=s.replace('alerts=Array.isArray(mi.alerts)?mi.alerts:[],view=getViewpoint(mi);const totalBreadth=', 'alerts=Array.isArray(mi.alerts)?mi.alerts:[],view=getViewpoint(mi),adaptive=getAdaptiveMarketBrief(data);const totalBreadth=',1)
          old_alert='if(alerts.length){lines.push(``,`5) CẢNH BÁO`);alerts.slice(0,2).forEach(a=>lines.push(`• ${a?.title||"Lưu ý"}${a?.detail?`: ${a.detail}`:""}`))}'
          new_alert=old_alert+'else{lines.push(``,`5) CẢNH BÁO`,`• Chưa có cảnh báo lớn từ bộ đọc thị trường. Tiếp tục theo dõi sự thay đổi của độ rộng, dòng tiền và nhóm dẫn dắt.`)}'
          s=s.replace(old_alert,new_alert,1)
          old_block='lines.push(``,`6) QUAN ĐIỂM HỆ THỐNG`,view.h,view.p);\nif(action.headline||action.detail)lines.push(``,`7) HÀNH ĐỘNG ƯU TIÊN`,`${action.headline||"Theo dõi thêm dữ liệu."}${action.detail?` ${action.detail}`:""}`);\nlines.push(``,`Theo dõi tiếp: độ rộng thị trường, xác nhận dòng tiền và độ bền của nhóm dẫn dắt.`,``,`Xem realtime: ${location.origin}${location.pathname}`,`Dữ liệu được hệ thống cập nhật tự động. Điểm trạng thái là công cụ hỗ trợ kỷ luật, không phải tín hiệu mua/bán.`);'
          new_block='lines.push(``,`6) QUAN ĐIỂM HỆ THỐNG`,adaptive.headline,adaptive.detail,`Điều kiện thay đổi cách nhìn: ${adaptive.transition}`);\nlines.push(``,`7) HÀNH ĐỘNG ƯU TIÊN`,adaptive.action);\nlines.push(``,`8) NGUYÊN TẮC TRONG NGÀY`,`“${adaptive.philosophy}”`);\nlines.push(``,`Theo dõi tiếp: ${adaptive.watch}.`,``,`Xem realtime: ${location.origin}${location.pathname}`,`Dữ liệu được hệ thống cập nhật tự động. Quan điểm và hành động thay đổi theo dữ liệu mới; Điểm trạng thái là công cụ hỗ trợ kỷ luật, không phải tín hiệu mua/bán.`);'
          if old_block not in s:
              raise SystemExit('brief output block not found')
          s=s.replace(old_block,new_block,1)
          p.write_text(s,encoding='utf-8')
          h=Path('thi-truong-hom-nay.html')
          hs=h.read_text(encoding='utf-8')
          hs=re.sub(r'src="assets/js/market-reader\.js(?:\?v=[^"]*)?"','src="assets/js/market-reader.js?v=20260913-3"',hs,count=1)
          h.write_text(hs,encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: |
          grep -q 'getAdaptiveMarketBrief' assets/js/market-reader.js
          grep -q '8) NGUYÊN TẮC TRONG NGÀY' assets/js/market-reader.js
          grep -q 'Điều kiện thay đổi cách nhìn' assets/js/market-reader.js
          grep -q 'market-reader.js?v=20260913-3' thi-truong-hom-nay.html
      - name: Commit
        shell: bash
        run: |
          git config user.name 'VÕ VŨ HOÀNG'
          git config user.email 'vvhoangvn@gmail.com'
          git add assets/js/market-reader.js thi-truong-hom-nay.html
          git commit -m 'Make copied market brief adaptive by market state' || exit 0
          git push
