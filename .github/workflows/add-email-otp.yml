name: Add email OTP login

on:
  push:
    paths:
      - '.github/workflows/add-email-otp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch shared popup and account page
        shell: python
        run: |
          from pathlib import Path

          # ---------- shared popup: site-header.js ----------
          p = Path('assets/js/site-header.js')
          s = p.read_text(encoding='utf-8')

          old = '''          <div class="vh-auth-field">
            <label>Mật khẩu</label>
            <input name="password" type="password" autocomplete="current-password" required placeholder="Nhập mật khẩu">
          </div>
          <div class="vh-auth-message" data-popup-login-message aria-live="polite"></div>
          <button class="vh-auth-submit" type="submit" data-popup-login-submit>Đăng nhập</button>
          <div class="vh-auth-divider">hoặc</div>
          <button class="vh-auth-google" type="button" data-popup-google>Tiếp tục với Google</button>'''

          new = '''          <div class="vh-auth-field">
            <label>Mật khẩu</label>
            <input name="password" type="password" autocomplete="current-password" required placeholder="Nhập mật khẩu">
          </div>
          <div class="vh-auth-message" data-popup-login-message aria-live="polite"></div>
          <button class="vh-auth-submit" type="submit" data-popup-login-submit>Đăng nhập</button>

          <button class="vh-auth-secondary" type="button" data-popup-otp-send>Đăng nhập bằng mã OTP email</button>
          <div class="vh-auth-otp-box" data-popup-otp-box hidden>
            <div class="vh-auth-field">
              <label>Mã OTP</label>
              <input name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="Nhập mã trong email">
            </div>
            <button class="vh-auth-secondary" type="button" data-popup-otp-verify>Xác nhận mã OTP</button>
            <p class="vh-auth-mini">Mã/link xác thực chỉ dùng một lần. Không chia sẻ cho người khác.</p>
          </div>

          <div class="vh-auth-divider">hoặc</div>
          <button class="vh-auth-google" type="button" data-popup-google>Tiếp tục với Google</button>'''

          if old not in s:
              raise SystemExit('site-header popup login block not found')
          s = s.replace(old, new, 1)

          old_css = '''    .vh-auth-submit,.vh-auth-google{
      width:100%;min-height:44px;border-radius:11px;font:inherit;font-size:11.5px;font-weight:800;cursor:pointer
    }
    .vh-auth-submit{border:1px solid rgba(224,187,99,.45);background:linear-gradient(180deg,#f0cf79,#d8b254);color:#201703}
    .vh-auth-google{border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.035);color:#fff}
    .vh-auth-submit:disabled,.vh-auth-google:disabled{opacity:.62;cursor:wait}'''

          new_css = '''    .vh-auth-submit,.vh-auth-google,.vh-auth-secondary{
      width:100%;min-height:44px;border-radius:11px;font:inherit;font-size:11.5px;font-weight:800;cursor:pointer
    }
    .vh-auth-submit{border:1px solid rgba(224,187,99,.45);background:linear-gradient(180deg,#f0cf79,#d8b254);color:#201703}
    .vh-auth-google{border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.035);color:#fff}
    .vh-auth-secondary{border:1px solid rgba(224,187,99,.24);background:rgba(224,187,99,.055);color:#f3cf74}
    .vh-auth-submit:disabled,.vh-auth-google:disabled,.vh-auth-secondary:disabled{opacity:.62;cursor:wait}
    .vh-auth-otp-box{display:grid;gap:9px;padding:10px;border:1px solid rgba(224,187,99,.13);border-radius:12px;background:rgba(224,187,99,.025)}
    .vh-auth-otp-box[hidden]{display:none!important}
    .vh-auth-mini{margin:0!important;font-size:9px!important;line-height:1.45;color:rgba(231,237,246,.46)!important}'''

          if old_css not in s:
              raise SystemExit('site-header auth css block not found')
          s = s.replace(old_css, new_css, 1)

          old_vars = '''  const googleButton = host.querySelector("[data-popup-google]");
  const passwordForm = host.querySelector("[data-password-form]");'''
          new_vars = '''  const googleButton = host.querySelector("[data-popup-google]");
  const otpSendButton = host.querySelector("[data-popup-otp-send]");
  const otpVerifyButton = host.querySelector("[data-popup-otp-verify]");
  const otpBox = host.querySelector("[data-popup-otp-box]");
  const otpInput = host.querySelector('[data-popup-otp-box] input[name="otp"]');
  const passwordForm = host.querySelector("[data-password-form]");'''
          if old_vars not in s:
              raise SystemExit('site-header auth vars block not found')
          s = s.replace(old_vars, new_vars, 1)

          marker = '''  googleButton.addEventListener("click", async () => {'''
          otp_logic = '''  otpSendButton?.addEventListener("click", async () => {
    setMessage(loginMessage);
    const email = String(new FormData(loginForm).get("email") || "").trim();
    if (!email || !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)) {
      setMessage(loginMessage, "Vui lòng nhập email hợp lệ trước khi gửi OTP.", "error");
      return;
    }

    otpSendButton.disabled = true;
    otpSendButton.textContent = "Đang gửi mã...";
    const { error } = await supabaseClient.auth.signInWithOtp({
      email,
      options: {
        shouldCreateUser: false,
        emailRedirectTo: `${window.location.origin}${window.location.pathname}`,
      },
    });

    if (error) {
      otpSendButton.disabled = false;
      otpSendButton.textContent = "Đăng nhập bằng mã OTP email";
      setMessage(loginMessage, "Chưa thể gửi mã xác thực. Vui lòng thử lại sau.", "error");
      return;
    }

    otpBox.hidden = false;
    otpSendButton.textContent = "Đã gửi mã / liên kết xác thực";
    setMessage(loginMessage, "Hãy kiểm tra email. Nếu email có mã OTP, nhập mã bên dưới; nếu có liên kết xác thực, bạn có thể bấm trực tiếp liên kết đó.", "success");
    requestAnimationFrame(() => otpInput?.focus());
    window.setTimeout(() => {
      otpSendButton.disabled = false;
      otpSendButton.textContent = "Gửi lại mã OTP";
    }, 60000);
  });

  otpVerifyButton?.addEventListener("click", async () => {
    setMessage(loginMessage);
    const email = String(new FormData(loginForm).get("email") || "").trim();
    const token = String(otpInput?.value || "").trim();
    if (!email || !token) {
      setMessage(loginMessage, "Vui lòng nhập email và mã OTP.", "error");
      return;
    }

    otpVerifyButton.disabled = true;
    otpVerifyButton.textContent = "Đang xác minh...";
    const { data, error } = await supabaseClient.auth.verifyOtp({ email, token, type: "email" });
    otpVerifyButton.disabled = false;
    otpVerifyButton.textContent = "Xác nhận mã OTP";

    if (error || !data.user) {
      setMessage(loginMessage, "Mã OTP chưa đúng hoặc đã hết hạn. Vui lòng kiểm tra lại.", "error");
      return;
    }

    await claimPendingAssessmentAfterLogin();
    renderAccount(data.user);
    setMessage(loginMessage, "Đăng nhập thành công.", "success");
    window.setTimeout(() => closeDialog(loginDialog), 300);
  });

'''
          if marker not in s:
              raise SystemExit('site-header google handler marker not found')
          s = s.replace(marker, otp_logic + marker, 1)
          p.write_text(s, encoding='utf-8')

          # ---------- full account page: dang-nhap.html ----------
          p = Path('dang-nhap.html')
          h = p.read_text(encoding='utf-8')

          old = '''                  <button class="auth-submit" id="loginSubmit" type="submit">
                    Đăng nhập
                  </button>


                  <div class="auth-divider">hoặc</div>'''
          new = '''                  <button class="auth-submit" id="loginSubmit" type="submit">
                    Đăng nhập
                  </button>

                  <button class="auth-otp-send" id="otpSendBtn" type="button">
                    Đăng nhập bằng mã OTP email
                  </button>

                  <div class="auth-otp-box" id="otpBox" hidden>
                    <p class="auth-helper">Mã/link xác thực chỉ dùng một lần. Không chia sẻ cho người khác.</p>
                    <div class="auth-field">
                      <label for="otpCode">Mã OTP</label>
                      <input id="otpCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="Nhập mã trong email">
                    </div>
                    <button class="auth-otp-send" id="otpVerifyBtn" type="button">Xác nhận mã OTP</button>
                  </div>

                  <div class="auth-divider">hoặc</div>'''
          if old not in h:
              raise SystemExit('dang-nhap login button block not found')
          h = h.replace(old, new, 1)

          css_marker = '''    .auth-google-btn{'''
          otp_css = '''    .auth-otp-send{
      width:100%;
      min-height:43px;
      border:1px solid rgba(224,187,99,.24);
      border-radius:12px;
      background:rgba(224,187,99,.055);
      color:#f3cf74;
      cursor:pointer;
      font:inherit;
      font-size:11px;
      font-weight:800;
    }
    .auth-otp-send:disabled{opacity:.62;cursor:wait}
    .auth-otp-box{display:grid;gap:10px;margin-top:2px;padding:11px;border:1px solid rgba(224,187,99,.13);border-radius:12px;background:rgba(224,187,99,.025)}
    .auth-otp-box[hidden]{display:none!important}

'''
          if css_marker not in h:
              raise SystemExit('dang-nhap google css marker not found')
          h = h.replace(css_marker, otp_css + css_marker, 1)

          vars_marker = '''    const recoveryBox = document.getElementById("recoveryBox");'''
          vars_new = '''    const recoveryBox = document.getElementById("recoveryBox");
    const otpSendBtn = document.getElementById("otpSendBtn");
    const otpVerifyBtn = document.getElementById("otpVerifyBtn");
    const otpBox = document.getElementById("otpBox");
    const otpCode = document.getElementById("otpCode");'''
          if vars_marker not in h:
              raise SystemExit('dang-nhap vars marker not found')
          h = h.replace(vars_marker, vars_new, 1)

          login_marker = '''    // ĐĂNG KÝ
    document.getElementById("signupForm").addEventListener("submit", async (event) => {'''
          otp_page_logic = '''    // ĐĂNG NHẬP BẰNG EMAIL OTP / MAGIC LINK
    otpSendBtn?.addEventListener("click", async () => {
      const email = document.getElementById("loginEmail").value.trim();
      if(!isValidEmail(email)){
        showMessage("Vui lòng nhập email hợp lệ trước khi gửi OTP.", "error");
        return;
      }

      showMessage("");
      setLoading(otpSendBtn, true, "Đăng nhập bằng mã OTP email", "Đang gửi mã...");
      const { error } = await supabaseClient.auth.signInWithOtp({
        email,
        options: {
          shouldCreateUser: false,
          emailRedirectTo: `${window.location.origin}${window.location.pathname}`
        }
      });

      if(error){
        setLoading(otpSendBtn, false, "Đăng nhập bằng mã OTP email", "Đang gửi mã...");
        showMessage("Chưa thể gửi mã xác thực. Vui lòng thử lại sau.", "error");
        return;
      }

      otpBox.hidden = false;
      otpSendBtn.textContent = "Đã gửi mã / liên kết xác thực";
      showMessage("Hãy kiểm tra email. Nếu email có mã OTP, nhập mã bên dưới; nếu có liên kết xác thực, bạn có thể bấm trực tiếp liên kết đó.", "success");
      otpCode?.focus();
      window.setTimeout(() => {
        otpSendBtn.disabled = false;
        otpSendBtn.textContent = "Gửi lại mã OTP";
      }, 60000);
    });

    otpVerifyBtn?.addEventListener("click", async () => {
      const email = document.getElementById("loginEmail").value.trim();
      const token = String(otpCode?.value || "").trim();
      if(!isValidEmail(email) || !token){
        showMessage("Vui lòng nhập email và mã OTP.", "error");
        return;
      }

      setLoading(otpVerifyBtn, true, "Xác nhận mã OTP", "Đang xác minh...");
      const { data, error } = await supabaseClient.auth.verifyOtp({ email, token, type: "email" });
      setLoading(otpVerifyBtn, false, "Xác nhận mã OTP", "Đang xác minh...");

      if(error || !data.user){
        showMessage("Mã OTP chưa đúng hoặc đã hết hạn. Vui lòng kiểm tra lại.", "error");
        return;
      }

      showMessage("Đăng nhập thành công.", "success");
      renderSignedIn(data.user);
    });


'''
          if login_marker not in h:
              raise SystemExit('dang-nhap signup marker not found')
          h = h.replace(login_marker, otp_page_logic + login_marker, 1)
          p.write_text(h, encoding='utf-8')

          # Cache-bust only the shared header script reference; do not touch page content.
          for html in Path('.').glob('*.html'):
              text = html.read_text(encoding='utf-8')
              text2 = text.replace('assets/js/site-header.js?v=20260913-4', 'assets/js/site-header.js?v=20260913-5')
              if text2 != text:
                  html.write_text(text2, encoding='utf-8')

      - name: Sanity checks
        shell: bash
        run: |
          grep -q 'data-popup-otp-send' assets/js/site-header.js
          grep -q 'signInWithOtp' assets/js/site-header.js
          grep -q 'verifyOtp' assets/js/site-header.js
          grep -q 'id="otpSendBtn"' dang-nhap.html
          grep -q 'id="otpVerifyBtn"' dang-nhap.html
          grep -q 'site-header.js?v=20260913-5' dang-nhap.html

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "VÕ VŨ HOÀNG"
          git config user.email "vvhoangvn@gmail.com"
          git add assets/js/site-header.js dang-nhap.html '*.html'
          git commit -m "Add email OTP login to shared auth" || exit 0
          git push
