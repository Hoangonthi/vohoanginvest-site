name: temp-test-morning-decision-v2
on:
  push:
    paths:
      - '.github/workflows/_temp-test-morning-decision-v2.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Call test endpoint
        run: |
          set -e
          curl -fsSL --max-time 30 'https://elmrbnewlukxscbcfizg.supabase.co/functions/v1/morning-decision-test' | tee /tmp/out.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/out.json'))
          print('ok=',d.get('ok'))
          print('version=',d.get('version'))
          print('decision=',d.get('evaluation',{}).get('decision'))
          print('balance=',d.get('evaluation',{}).get('balance_score'))
          print('quality=',d.get('quality'))
          print('sources=')
          for s in d.get('sources',[]): print(' -',s.get('name'),s.get('status'))
          print('events=')
          for e in d.get('upcoming_events',[]): print(' -',e)
          print('variables=')
          for x in d.get('variables',[]): print(' -',x.get('kind'),x.get('direction'),x.get('impact_score'),x.get('title'))
          PY
