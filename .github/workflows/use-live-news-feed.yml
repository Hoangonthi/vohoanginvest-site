name: Use live news feed

on:
  push:
    paths:
      - '.github/workflows/use-live-news-feed.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Point market page to live news mode
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('thi-truong-hom-nay.html')
          s=p.read_text(encoding='utf-8')
          old='https://elmrbnewlukxscbcfizg.supabase.co/functions/v1/broker-brief-public'
          new='https://elmrbnewlukxscbcfizg.supabase.co/functions/v1/broker-brief-public?mode=news'
          if new not in s:
              if old not in s:
                  raise SystemExit('NEWS_ENDPOINT not found')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'VÕ VŨ HOÀNG'
          git config user.email 'vvhoangvn@gmail.com'
          git add thi-truong-hom-nay.html
          git commit -m 'Use continuously refreshed news feed' || exit 0
          git push
