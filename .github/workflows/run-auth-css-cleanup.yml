name: Run auth CSS cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean duplicate CSS
        run: python .tmp-clean-auth-css.py

      - name: Remove temporary cleanup files
        run: rm -f .tmp-clean-auth-css.py .github/workflows/run-auth-css-cleanup.yml

      - name: Commit cleanup
        run: |
          git config user.name "VÕ VŨ HOÀNG"
          git config user.email "vvhoangvn@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Clean duplicate shared auth CSS"
          git push
