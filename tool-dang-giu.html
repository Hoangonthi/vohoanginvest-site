<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đang giữ – Investor Decision OS</title><link rel="stylesheet" href="assets/css/decision-tool.css"></head><body data-stage="HOLDING"><header class="top"><div class="inner"><strong>ĐANG GIỮ</strong><a href="investor-os.html">Investor OS</a><a href="./">Trang chủ</a></div></header><main class="wrap"><section class="card"><div class="eyebrow">RÀ SOÁT VỊ THẾ</div><h1>Có gì đã thay đổi?</h1><p class="note">Không hỏi “giá đang xanh hay đỏ?”. Hỏi thesis, rủi ro và dữ kiện mới có làm thay đổi quyết định ban đầu hay không.</p></section><section class="card"><div class="grid"><label><span>Mã cổ phiếu</span><input id="symbol"></label><label><span>Giá vốn</span><input id="avgPrice" type="number" step="0.01"></label><label><span>Giá hiện tại</span><input id="marketPrice" type="number" step="0.01"></label><label><span>Giá stop hiện tại</span><input id="stopPrice" type="number" step="0.01"></label><label><span>Thesis còn đúng?</span><select id="thesisValid"><option value="YES">Còn đúng</option><option value="UNCERTAIN">Chưa chắc</option><option value="NO">Không còn đúng</option></select></label><label><span>Mức độ dữ kiện mới</span><select id="materiality"><option value="LOW">Nhiễu / nhỏ</option><option value="MEDIUM">Cần theo dõi</option><option value="HIGH">Có thể thay đổi thesis</option></select></label><label style="grid-column:1/-1"><span>Dữ kiện mới là gì?</span><textarea id="newInfo"></textarea></label></div><div class="actions"><button class="primary" id="run">Rà soát vị thế</button></div><p id="msg" class="note"></p></section><section id="result" class="card result"><div class="eyebrow">KẾT QUẢ</div><div class="metrics"><div class="metric"><span>P&L hiện tại</span><b id="rPnl">—</b></div><div class="metric"><span>Thesis</span><b id="rThesis">—</b></div><div class="metric"><span>Mức độ thay đổi</span><b id="rMat">—</b></div></div><div class="nba"><strong>Next Best Action</strong><p id="rAction"></p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="decision-tool.js"></script></body></html>
